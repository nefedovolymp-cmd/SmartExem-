ские мероприятия."}, "flash": "Профилактика экономических преступлений ОВД (подразделения ЭБиПК) — деятельность по выявлению, предупреждению и пресечению преступлений в экономике. Направления: выявление и устранение причин и условий преступлений, оперативно-розыскная деятельность, профилактические мероприятия с хозяйствующими субъектами, взаимодействие с контролирующими органами и службами безопасности предприятий. Различают общую (воздействие на причины) и индивидуальную (работа с конкретными лицами) профилактику. Это ключевое звено обеспечения ЭБ государства."}, {"id": 72, "text": "Понятие, цели, система и виды наказаний. Назначение наказания. Условное осуждение.", "topic": "Уголовное право", "quiz": {"q": "Какой вид наказания НЕ предусмотрен УК РФ?", "options": ["обязательные работы", "лишение свободы", "телесное наказание", "штраф"], "correct": 2, "explain": "Телесные наказания запрещены. Система наказаний (ст. 44 УК РФ) включает штраф, работы, ограничение и лишение свободы и др."}, "flash": "Наказание (ст. 43 УК РФ) — мера государственного принуждения по приговору суда, цель — восстановление справедливости, исправление осуждённого и предупреждение преступлений. Система видов (ст. 44): штраф, лишение права занимать должности, обязательные, исправительные, принудительные работы, ограничение и лишение свободы, пожизненное лишение свободы и др. Назначение наказания (ст. 60) учитывает характер и степень опасности, личность, смягчающие и отягчающие обстоятельства. Условное осуждение (ст. 73) — неприменение реального наказания под контролем."}, {"id": 73, "text": "Освобождение от уголовной ответственности и наказания. Ответственность несовершеннолетних.", "topic": "Уголовное право", "quiz": {"q": "Освобождение от уголовной ответственности возможно, в частности, в связи с:", "options": ["деятельным раскаянием, примирением с потерпевшим, истечением сроков давности", "повторностью", "тяжестью преступления", "увеличением штрафа"], "correct": 0, "explain": "Основания (гл. 11 УК РФ): деятельное раскаяние, примирение с потерпевшим, возмещение ущерба по экономическим составам, истечение давности."}, "flash": "Освобождение от уголовной ответственности (гл. 11 УК РФ): в связи с деятельным раскаянием (ст. 75), примирением с потерпевшим (ст. 76), возмещением ущерба по преступлениям в сфере экономической деятельности (ст. 76.1), истечением сроков давности (ст. 78), судебным штрафом (ст. 76.2). Освобождение от наказания — гл. 12. Уголовная ответственность несовершеннолетних (гл. 14) имеет особенности: сниженные сроки, принудительные меры воспитательного воздействия, учёт возраста. Возмещение ущерба по экономическим преступлениям — значимый инструмент защиты интересов потерпевших."}, {"id": 74, "text": "Преступления против интересов службы в коммерческих и иных организациях.", "topic": "Уголовное право", "quiz": {"q": "Преступления против интересов службы в коммерческих организациях (гл. 23 УК РФ) включают:", "options": ["убийство", "государственную измену", "кражу", "злоупотребление полномочиями и коммерческий подкуп (ст. 201, 204)"], "correct": 3, "explain": "Глава 23 УК РФ: злоупотребление полномочиями (ст. 201), коммерческий подкуп (ст. 204) и др."}, "flash": "Преступления против интересов службы в коммерческих и иных организациях (гл. 23 УК РФ): злоупотребление полномочиями (ст. 201), злоупотребление полномочиями частными нотариусами и аудиторами (ст. 202), превышение полномочий частными охранниками/детективами (ст. 203), коммерческий подкуп (ст. 204). Объект — интересы нормальной деятельности коммерческих организаций. Субъект — лицо, выполняющее управленческие функции. Эти составы напрямую связаны с корпоративным мошенничеством и угрозами ЭБ предприятия."}, {"id": 75, "text": "Преступления против общественной безопасности.", "topic": "Уголовное право", "quiz": {"q": "Преступления против общественной безопасности (гл. 24 УК РФ) включают:", "options": ["нарушение ПДД", "терроризм, бандитизм, организацию преступного сообщества", "клевету", "неуплату налогов"], "correct": 1, "explain": "Глава 24 УК РФ: террористический акт (ст. 205), бандитизм (ст. 209), организация преступного сообщества (ст. 210) и др."}, "flash": "Преступления против общественной безопасности (гл. 24 УК РФ): террористический акт (ст. 205), содействие терроризму, захват заложника, организация незаконного вооружённого формирования, бандитизм (ст. 209), организация преступного сообщества (ст. 210), хулиганство, незаконный оборот оружия. Объект — общественная безопасность как состояние защищённости жизненно важных интересов общества. Организованная экономическая преступность нередко связана с этими составами, что усиливает их значение для комплексной безопасности."}, {"id": 76, "text": "Преступления против основ конституционного строя и безопасности государства.", "topic": "Уголовное право", "quiz": {"q": "Преступления против основ конституционного строя и безопасности государства (гл. 29 УК РФ) включают:", "options": ["безбилетный проезд", "мелкое хищение", "государственную измену и шпионаж (ст. 275, 276)", "нарушение тишины"], "correct": 2, "explain": "Глава 29 УК РФ: государственная измена (ст. 275), шпионаж (ст. 276), диверсия (ст. 281) и др."}, "flash": "Преступления против основ конституционного строя и безопасности государства (гл. 29 УК РФ): государственная измена (ст. 275), шпионаж (ст. 276), посягательство на жизнь государственного деятеля, насильственный захват власти, вооружённый мятеж, диверсия (ст. 281), возбуждение ненависти, разглашение государственной тайны. Объект — внешняя и внутренняя безопасность государства, его конституционный строй. Эти преступления представляют высшую степень угрозы национальной, в том числе экономической, безопасности."}, {"id": 77, "text": "Преступления против государственной власти, интересов госслужбы и службы в ОМСУ.", "topic": "Уголовное право", "quiz": {"q": "Получение и дача взятки относятся к главе УК РФ:", "options": ["гл. 16 (против жизни)", "гл. 26 (экологические)", "гл. 21 (против собственности)", "гл. 30 (против государственной власти и интересов госслужбы)"], "correct": 3, "explain": "Взяточничество (ст. 290–291.2) относится к гл. 30 УК РФ — против госвласти, интересов госслужбы и службы в ОМСУ."}, "flash": "Преступления против государственной власти, интересов государственной службы и службы в ОМСУ (гл. 30 УК РФ): злоупотребление должностными полномочиями (ст. 285), превышение полномочий (ст. 286), получение взятки (ст. 290), дача взятки (ст. 291), посредничество во взяточничестве (ст. 291.1), мелкое взяточничество (ст. 291.2), служебный подлог, халатность. Субъект — должностное лицо. Эти коррупционные преступления — одна из главных угроз ЭБ государства, разрушающая конкуренцию и инвестиционный климат."}, {"id": 78, "text": "Понятие уголовного процесса.", "topic": "Уголовное право", "quiz": {"q": "Уголовный процесс — это:", "options": ["деятельность по расследованию и рассмотрению уголовных дел, урегулированная УПК РФ", "налоговое планирование", "ведение бухучёта", "рассмотрение гражданских споров"], "correct": 0, "explain": "Уголовный процесс — урегулированная УПК РФ деятельность по возбуждению, расследованию, рассмотрению и разрешению уголовных дел."}, "flash": "Уголовный процесс (судопроизводство) — урегулированная УПК РФ деятельность органов дознания, следствия, прокуратуры и суда по возбуждению, расследованию, рассмотрению и разрешению уголовных дел. Назначение — защита прав потерпевших и защита личности от незаконного обвинения. Стадии: возбуждение дела, предварительное расследование, назначение судебного заседания, судебное разбирательство, апелляция, кассация, надзор, исполнение приговора. Принципы: законность, презумпция невиновности, состязательность, право на защиту."}, {"id": 79, "text": "Субъекты хозяйственных отношений. Организационно-правовые формы предприятий.", "topic": "Хозяйственное право", "quiz": {"q": "Какая организационно-правовая форма предполагает разделение уставного капитала на доли участников с ограниченной ответственностью?", "options": ["индивидуальный предприниматель", "полное товарищество", "унитарное предприятие", "ООО (общество с ограниченной ответственностью)"], "correct": 3, "explain": "В ООО уставный капитал разделён на доли, участники не отвечают по долгам общества и несут риск в пределах вкладов (ст. 87 ГК РФ)."}, "flash": "Субъекты хозяйственных отношений (ГК РФ): коммерческие организации (хозяйственные товарищества — полные и на вере; хозяйственные общества — ООО, АО; производственные кооперативы; унитарные предприятия), некоммерческие организации, индивидуальные предприниматели, публично-правовые образования. ООО — капитал разделён на доли, ответственность ограничена вкладами. АО — капитал разделён на акции (публичные и непубличные). Выбор формы определяет объём ответственности, порядок управления и налогообложения — важно для ЭБ бизнеса."}, {"id": 80, "text": "Вещные и обязательственные права в хозяйственных правоотношениях.", "topic": "Хозяйственное право", "quiz": {"q": "Вещные права отличаются от обязательственных тем, что:", "options": ["возникают только из договора", "всегда срочные", "закрепляют господство лица над вещью (право собственности и др.)", "не защищаются законом"], "correct": 2, "explain": "Вещные права (собственность, хозведение, оперативное управление, сервитут) закрепляют непосредственное господство над вещью; обязательственные — права требования."}, "flash": "В хозяйственных правоотношениях различают вещные и обязательственные права. Вещные права (раздел II ГК РФ) закрепляют непосредственное господство лица над вещью: право собственности, хозяйственного ведения, оперативного управления, сервитут, право постоянного пользования землёй. Признаки: абсолютность, право следования, бессрочность. Обязательственные права (из договоров и иных оснований) — права требования к конкретному должнику. Защита вещных прав (виндикационный и негаторный иски) — важный механизм защиты имущественных интересов и ЭБ."}, {"id": 81, "text": "Понятие и сущность несостоятельности (банкротства). Правовое регулирование банкротства.", "topic": "Хозяйственное право", "quiz": {"q": "Несостоятельность (банкротство) предприятия регулируется:", "options": ["Трудовым кодексом", "ФЗ от 26.10.2002 № 127-ФЗ «О несостоятельности (банкротстве)»", "Законом о рекламе", "Уголовным кодексом"], "correct": 1, "explain": "Базовый акт — ФЗ № 127-ФЗ; процедуры банкротства: наблюдение, финансовое оздоровление, внешнее управление, конкурсное производство, мировое соглашение."}, "flash": "Несостоятельность (банкротство) — признанная арбитражным судом неспособность должника удовлетворить требования кредиторов и уплатить обязательные платежи (ФЗ № 127-ФЗ). Признак для юрлица — неисполнение свыше 3 месяцев. Процедуры: наблюдение, финансовое оздоровление, внешнее управление, конкурсное производство, мировое соглашение. Цель — соразмерное удовлетворение требований кредиторов и (при возможности) восстановление платёжеспособности. Преднамеренное и фиктивное банкротство (ст. 196, 197 УК РФ) — угрозы ЭБ, используемые для вывода активов."}, {"id": 82, "text": "Право собственности: понятие, формы, виды, содержание. Приобретение и прекращение.", "topic": "Хозяйственное право", "quiz": {"q": "Право собственности включает три правомочия:", "options": ["залог, дарение, мена", "владение, пользование, распоряжение", "аренда, лизинг, прокат", "купля, продажа, аренда"], "correct": 1, "explain": "Содержание права собственности (ст. 209 ГК РФ) — владение, пользование и распоряжение имуществом."}, "flash": "Право собственности (ст. 209 ГК РФ) — наиболее полное вещное право, включающее три правомочия: владение (фактическое обладание), пользование (извлечение полезных свойств), распоряжение (определение юридической судьбы вещи). Формы: частная, государственная, муниципальная. Способы приобретения: первоначальные (создание вещи, переработка, находка) и производные (договор, наследование, реорганизация). Прекращение: отчуждение, отказ, гибель вещи, принудительное изъятие (конфискация, реквизиция, национализация). Защита собственности — основа ЭБ."}, {"id": 83, "text": "Государственное регулирование экономики: способы и формы участия государства и МО.", "topic": "Хозяйственное право", "quiz": {"q": "Государственное регулирование экономики осуществляется методами:", "options": ["только запретами", "исключительно рыночными силами", "прямыми (административными) и косвенными (экономическими)", "только наказаниями"], "correct": 2, "explain": "Методы госрегулирования: прямые (лицензирование, квоты, госзаказ) и косвенные (налоги, субсидии, денежно-кредитная политика)."}, "flash": "Государственное регулирование экономики объективно необходимо для устранения «провалов рынка», защиты конкуренции, обеспечения социальной справедливости и ЭБ. Методы: прямые (административные) — лицензирование, квотирование, госзаказ, регистрация, антимонопольный контроль; косвенные (экономические) — налоги, субсидии, таможенные пошлины, денежно-кредитная и бюджетная политика. Формы участия государства и МО: собственник имущества, предприниматель (унитарные предприятия, госкорпорации), регулятор, заказчик (госзакупки по ФЗ № 44-ФЗ)."}, {"id": 84, "text": "Понятие, существенные условия и виды договора. Заключение, изменение, расторжение. Ограничения свободы договора.", "topic": "Хозяйственное право", "quiz": {"q": "Существенным условием любого договора является:", "options": ["условие о сроке всегда", "условие о неустойке", "условие о цене во всех случаях", "условие о предмете договора"], "correct": 3, "explain": "Существенное условие любого договора — предмет (ст. 432 ГК РФ); прочие существенные условия зависят от вида договора."}, "flash": "Договор (ст. 420 ГК РФ) — соглашение об установлении, изменении или прекращении прав и обязанностей. Существенные условия (ст. 432): о предмете (всегда), названные в законе для данного вида договора, и условия, по которым по заявлению стороны должно быть достигнуто соглашение. Виды: возмездные/безвозмездные, консенсуальные/реальные, публичные, присоединения. Заключение, изменение и расторжение — гл. 28–29 ГК РФ. Свобода договора (ст. 421) ограничивается в публичных целях (защита конкуренции, потребителей). Грамотная договорная работа — основа правовой ЭБ."}, {"id": 85, "text": "Правоохранительные органы и спецслужбы РФ — субъекты обеспечения ЭБ.", "topic": "Уголовное право", "quiz": {"q": "Какой орган осуществляет надзор за исполнением законов в сфере ЭБ?", "options": ["биржа", "профсоюз", "прокуратура", "торговая палата"], "correct": 2, "explain": "Прокуратура осуществляет надзор за исполнением законов; в обеспечении ЭБ участвуют также МВД, ФСБ, СК, ФТС, Росфинмониторинг."}, "flash": "Субъектами обеспечения ЭБ являются правоохранительные органы и спецслужбы: МВД (подразделения по борьбе с экономическими преступлениями ЭБиПК), ФСБ (контрразведка, защита экономической безопасности государства), Следственный комитет (расследование тяжких экономических преступлений), прокуратура (надзор за исполнением законов и поддержание обвинения), ФТС (таможенный контроль), Росфинмониторинг (ПОД/ФТ), Росгвардия. Они взаимодействуют между собой и со службами безопасности предприятий в выявлении, пресечении и расследовании экономических преступлений."}, {"id": 86, "text": "Понятие и классификация экономических преступлений в уголовном праве и криминологии.", "topic": "Уголовное право", "quiz": {"q": "Экономические преступления в широком смысле — это деяния:", "options": ["в сфере экономической деятельности, против собственности и интересов службы", "против правосудия", "против жизни и здоровья", "экологические"], "correct": 0, "explain": "Экономические преступления посягают на собственность (гл. 21), экономическую деятельность (гл. 22) и интересы службы в организациях (гл. 23)."}, "flash": "Экономические преступления — общественно опасные деяния, посягающие на отношения в сфере экономики. В уголовном праве их относят к главам 21 (против собственности — кража, мошенничество, присвоение), 22 (в сфере экономической деятельности — незаконное предпринимательство, легализация, уклонение от налогов, преднамеренное банкротство), 23 (против интересов службы в организациях). В криминологии классифицируют по сфере (финансовые, налоговые, таможенные), по субъекту, по способу. Понимание классификации необходимо для построения системы профилактики и обеспечения ЭБ."}, {"id": 87, "text": "Теоретические и правовые основы профилактики экономических преступлений ОВД.", "topic": "Уголовное право", "quiz": {"q": "Общая профилактика экономических преступлений направлена на:", "options": ["устранение причин и условий, порождающих преступность", "наказание конкретного преступника", "увеличение штрафов", "ликвидацию предприятий"], "correct": 0, "explain": "Общая профилактика воздействует на причины и условия преступности в целом; индивидуальная — на конкретных лиц."}, "flash": "Теоретические и правовые основы профилактики экономических преступлений ОВД: профилактика — система мер по выявлению и устранению причин и условий преступлений. Уровни: общесоциальная (улучшение экономики и правопорядка), специально-криминологическая (целевые меры), индивидуальная (работа с конкретными лицами). Правовая база: УК РФ, ФЗ «О полиции», ФЗ «Об оперативно-розыскной деятельности», ФЗ № 182-ФЗ «Об основах системы профилактики правонарушений». Эффективная профилактика снижает уровень экономической преступности — основу угроз ЭБ."}, {"id": 88, "text": "Кадровая безопасность организации: сущность, современные концепции.", "topic": "Кадровая безопасность", "quiz": {"q": "Кадровая безопасность организации — это:", "options": ["защищённость организации от угроз, связанных с персоналом", "количество вакансий", "размер фонда оплаты труда", "наличие отдела кадров"], "correct": 0, "explain": "Кадровая безопасность — защищённость от рисков и угроз, исходящих от персонала и связанных с человеческим фактором."}, "flash": "Кадровая безопасность — состояние защищённости организации от рисков и угроз, связанных с персоналом (человеческим фактором). Это важнейшая составляющая ЭБ, поскольку большинство угроз исходит именно от сотрудников. Современные концепции рассматривают её в трёх аспектах: безопасность найма (отбор и проверка), безопасность лояльности (мотивация, корпоративная культура) и безопасность увольнения (защита от ущерба при уходе). Угрозы: хищения, мошенничество, разглашение тайны, саботаж, переход к конкурентам, конфликт интересов."}, {"id": 89, "text": "Правовые аспекты обеспечения кадровой безопасности персонала.", "topic": "Кадровая безопасность", "quiz": {"q": "Правовой основой защиты коммерческой тайны при работе с персоналом является:", "options": ["Лесной кодекс", "Закон об ОСАГО", "Закон о рекламе", "ФЗ № 98-ФЗ «О коммерческой тайне» и Трудовой кодекс"], "correct": 3, "explain": "Режим коммерческой тайны устанавливается по ФЗ № 98-ФЗ; обязанности работника — по ТК РФ."}, "flash": "Правовые аспекты кадровой безопасности: трудовые отношения регулируются ТК РФ (порядок приёма, перевода, увольнения, материальная ответственность, дисциплина). Защита информации — ФЗ № 98-ФЗ «О коммерческой тайне» (введение режима, обязательства о неразглашении), ФЗ № 152-ФЗ «О персональных данных». Проверка кандидатов ограничена законодательством о персональных данных. Материальная ответственность работника (гл. 39 ТК РФ) — инструмент возмещения ущерба. Грамотное правовое оформление кадровых отношений минимизирует риски и обеспечивает кадровую безопасность."}, {"id": 90, "text": "Кадровая политика, ориентированная на социальное управление, приоритет социальных ценностей.", "topic": "Кадровая безопасность", "quiz": {"q": "Кадровая политика, ориентированная на социальное управление, предполагает:", "options": ["только контроль и наказания", "игнорирование интересов работников", "сокращение всех расходов на персонал", "приоритет социальных ценностей, развитие и мотивацию персонала"], "correct": 3, "explain": "Социально ориентированная кадровая политика ставит в приоритет развитие персонала, мотивацию и социальные гарантии."}, "flash": "Кадровая политика — система принципов и норм работы с персоналом для достижения целей организации. Социально ориентированная модель ставит в приоритет социальные ценности: развитие человеческого потенциала, мотивацию, благоприятный климат, социальные гарантии, баланс интересов работника и работодателя. Такая политика повышает лояльность и снижает кадровые риски (текучесть, недобросовестность), что напрямую укрепляет кадровую безопасность. Противоположный, чисто репрессивный подход порождает скрытые угрозы и сопротивление персонала."}, {"id": 91, "text": "Организационно-правовые основы кадровой политики в РФ.", "topic": "Кадровая безопасность", "quiz": {"q": "Организационно-правовые основы кадровой политики в РФ закреплены прежде всего в:", "options": ["Законе о связи", "Трудовом кодексе РФ", "Бюджетном кодексе", "Уголовном кодексе"], "correct": 1, "explain": "Основа регулирования трудовых и кадровых отношений — Трудовой кодекс РФ и связанные с ним акты."}, "flash": "Организационно-правовые основы кадровой политики в РФ: Конституция РФ (право на труд), Трудовой кодекс РФ (базовое регулирование трудовых отношений), федеральные законы (о персональных данных, о коммерческой тайне, о госслужбе), локальные нормативные акты (правила внутреннего распорядка, положения о персонале, об оплате труда, о коммерческой тайне). Кадровая политика реализуется через отбор, адаптацию, обучение, мотивацию, оценку и контроль персонала. Правовая регламентация защищает и работника, и работодателя, обеспечивая кадровую составляющую ЭБ."}, {"id": 92, "text": "Роль и место комплексной безопасности в системе национальной безопасности.", "topic": "ЭБ государства", "quiz": {"q": "Комплексная безопасность в системе национальной безопасности — это:", "options": ["только ЭБ предприятий", "только охрана границ", "взаимосвязанная защита по всем видам безопасности (экономической, военной, информационной и др.)", "только военная защита"], "correct": 2, "explain": "Комплексная безопасность объединяет все виды (экономическую, военную, информационную, экологическую и др.) как части национальной безопасности."}, "flash": "Национальная безопасность (ФЗ № 390-ФЗ, Стратегия № 400) — состояние защищённости личности, общества и государства от внутренних и внешних угроз. Комплексная безопасность означает взаимосвязь её видов: государственная, военная, экономическая, информационная, экологическая, общественная, транспортная и др. Экономическая безопасность занимает базовое место, так как экономика — материальная основа всех остальных видов. Роль комплексного подхода — обеспечить, чтобы меры в одной сфере не создавали угроз в другой, и достигать синергии в защите национальных интересов."}, {"id": 93, "text": "Структурные компоненты системы обеспечения безопасности страны.", "topic": "ЭБ государства", "quiz": {"q": "Структурные компоненты системы обеспечения безопасности страны включают:", "options": ["только спецслужбы", "силы и средства обеспечения безопасности, органы управления, правовую базу", "только армию", "только полицию"], "correct": 1, "explain": "Система включает органы и силы обеспечения безопасности, средства, правовую и информационную основу."}, "flash": "Система обеспечения безопасности страны (ФЗ № 390-ФЗ «О безопасности») включает структурные компоненты: органы государственной власти (Президент, Совет Безопасности, Правительство, федеральные органы), силы обеспечения безопасности (вооружённые силы, правоохранительные органы, спецслужбы), средства обеспечения безопасности, правовую основу (Конституция, законы, стратегии), а также негосударственные субъекты. Координирующую роль играет Совет Безопасности РФ. Система функционирует на принципах законности, единства, взаимодействия и приоритета предупредительных мер."}, {"id": 94, "text": "Основные органы системы обеспечения безопасности России, их функции.", "topic": "ЭБ государства", "quiz": {"q": "Координирующим органом в сфере обеспечения национальной безопасности при Президенте РФ является:", "options": ["Совет Безопасности РФ", "Счётная палата", "Центральный банк", "Государственная Дума"], "correct": 0, "explain": "Совет Безопасности РФ — конституционный совещательный орган, координирующий деятельность по обеспечению нацбезопасности."}, "flash": "Основные органы системы обеспечения безопасности России: Президент РФ (общее руководство, определение основных направлений); Совет Безопасности РФ (координация, подготовка решений по нацбезопасности); Правительство РФ (реализация мер, в том числе экономических); федеральные органы — ФСБ (госбезопасность, контрразведка), МВД (правопорядок, борьба с преступностью), СВР (внешняя разведка), Минобороны, Росгвардия, прокуратура (надзор). В экономической сфере участвуют Минфин, ФНС, ФТС, Банк России, Росфинмониторинг, Счётная палата. Их скоординированная работа обеспечивает все виды безопасности."}, {"id": 95, "text": "Угрозы ЭБ в секторах услуг: банковских, страховых, информационных, туристических.", "topic": "ЭБ предприятия", "quiz": {"q": "Угрозы ЭБ в банковском секторе включают:", "options": ["рост числа вкладчиков", "расширение филиалов", "снижение инфляции", "кредитные риски, мошенничество, отмывание денег, киберугрозы"], "correct": 3, "explain": "Банковский сектор: кредитные и ликвидные риски, мошенничество, легализация доходов, кибератаки, отток вкладов."}, "flash": "Угрозы ЭБ в секторах услуг специфичны: банковский — кредитные риски, мошенничество с картами и кредитами, отмывание денег, кибератаки, отток ликвидности; страховой — страховое мошенничество, неплатёжеспособность страховщиков, недобросовестные выплаты; информационный — утечки данных, кибератаки, нарушение работы систем; туристический — банкротство туроператоров, мошенничество, репутационные риски. Общие меры защиты: лицензирование и надзор, внутренний контроль, риск-менеджмент, страхование ответственности, информационная безопасность."}, {"id": 96, "text": "Конкурентная разведка. Цикл и основные направления ведения.", "topic": "ЭБ предприятия", "quiz": {"q": "Цикл конкурентной разведки начинается с этапа:", "options": ["анализа", "сбора информации", "планирования (постановки задач)", "распространения результатов"], "correct": 2, "explain": "Цикл: планирование → сбор → обработка и анализ → доведение результатов до пользователя."}, "flash": "Конкурентная разведка ведётся циклически. Этапы цикла: 1) планирование — определение информационных потребностей и постановка задач; 2) сбор информации из открытых легальных источников (СМИ, отчётность, базы данных, интернет, выставки); 3) обработка и анализ — превращение данных в выводы; 4) доведение результатов (разведпродукта) до лиц, принимающих решения. Основные направления: разведка рынка, конкурентов, контрагентов, технологий, рисков. Цель — информационное обеспечение решений для повышения конкурентоспособности и ЭБ предприятия в рамках закона."}, {"id": 97, "text": "Понятие корпоративного мошенничества. Типы и виды, влияние на бизнес.", "topic": "ЭБ предприятия", "quiz": {"q": "Корпоративное мошенничество — это:", "options": ["маркетинговая акция", "аудиторская проверка", "умышленные действия в ущерб организации ради незаконной выгоды", "законная оптимизация"], "correct": 2, "explain": "Корпоративное мошенничество — умышленные злоупотребления сотрудников или руководства в ущерб организации ради личной выгоды."}, "flash": "Корпоративное мошенничество — умышленные противоправные действия сотрудников, руководства или третьих лиц в ущерб организации с целью извлечения незаконной выгоды. Классификация (по ACFE): незаконное присвоение активов (хищения, махинации с закупками, фиктивные сотрудники), коррупция (откаты, конфликт интересов), искажение отчётности (фальсификация). Влияние на бизнес: прямые финансовые потери, репутационный ущерб, утрата доверия инвесторов. «Треугольник мошенничества»: давление, возможность, самооправдание. Противодействие — внутренний контроль, внутренний аудит и СЭБ."}, {"id": 98, "text": "Система экономической контрразведки предприятия, способы доступа к конфиденциальной информации.", "topic": "ЭБ предприятия", "quiz": {"q": "Экономическая контрразведка предприятия направлена на:", "options": ["защиту собственной конфиденциальной информации от посягательств", "уплату налогов", "рекламу продукции", "сбор информации о конкурентах"], "correct": 0, "explain": "Контрразведка защищает предприятие от чужой разведки и утечек: выявляет каналы утечки и пресекает несанкционированный доступ."}, "flash": "Экономическая контрразведка предприятия — деятельность по защите собственной конфиденциальной информации от разведывательных устремлений конкурентов и злоумышленников (в противоположность конкурентной разведке, добывающей информацию). Задачи: выявление и перекрытие каналов утечки, защита коммерческой тайны, противодействие промышленному шпионажу, проверка лояльности персонала. Способы несанкционированного доступа к информации: подкуп и вербовка сотрудников, технические средства съёма, кибератаки, социальная инженерия, анализ открытых источников. Контрразведка — часть информационной и силовой составляющих ЭБ."}, {"id": 99, "text": "Угрозы безопасности информации, источник угроз, целостность/конфиденциальность/доступность. Классификация угроз.", "topic": "Информационная безопасность", "quiz": {"q": "«Триада» свойств безопасности информации — это:", "options": ["логин, пароль, код", "скорость, цена, объём", "конфиденциальность, целостность, доступность", "ввод, вывод, хранение"], "correct": 2, "explain": "Базовые свойства защищаемой информации: конфиденциальность, целостность и доступность (КЦД)."}, "flash": "Безопасность информации — состояние защищённости информации, при котором обеспечиваются её конфиденциальность (доступ только уполномоченным), целостность (неизменность, защита от искажения) и доступность (своевременный доступ уполномоченных лиц). Угроза безопасности информации — потенциальная причина нарушения этих свойств; источник угроз — субъект или явление, порождающее угрозу. Классификация угроз: по природе (антропогенные, техногенные, стихийные), по расположению (внутренние, внешние), по характеру (случайные, преднамеренные). Защита информации — составляющая ЭБ предприятия."}, {"id": 100, "text": "Органы по защите информации в РФ, их задачи и полномочия.", "topic": "Информационная безопасность", "quiz": {"q": "Уполномоченным федеральным органом по технической защите информации является:", "options": ["Росстат", "Министерство культуры", "Роспотребнадзор", "ФСТЭК России"], "correct": 3, "explain": "Техническая защита информации — компетенция ФСТЭК России; криптография и спецсвязь — ФСБ России."}, "flash": "Органы защиты информации в РФ: ФСТЭК России (техническая и некриптографическая защита информации, защита гостайны от утечки по техническим каналам, требования к значимым объектам КИИ); ФСБ России (криптографическая защита, безопасность в информационно-телекоммуникационных сетях, ГосСОПКА); Роскомнадзор (надзор за обработкой персональных данных); Банк России (информбезопасность в финансовой сфере). Правовая база: ФЗ № 149-ФЗ «Об информации», № 152-ФЗ «О персональных данных», № 187-ФЗ «О безопасности КИИ»."}, {"id": 101, "text": "Обеспечение безопасности при осуществлении предпринимательской деятельности.", "topic": "Хозяйственное право", "quiz": {"q": "Обеспечение безопасности предпринимательской деятельности предполагает прежде всего:", "options": ["сокрытие доходов", "защиту бизнеса от внутренних и внешних угроз правовыми и организационными мерами", "отказ от налогов", "ликвидацию конкурентов"], "correct": 1, "explain": "Безопасность предпринимательства — защита законных интересов бизнеса от угроз комплексом правовых, организационных и иных мер."}, "flash": "Обеспечение безопасности предпринимательской деятельности — комплекс правовых, организационных, экономических и технических мер по защите законных интересов бизнеса от внутренних и внешних угроз (недобросовестная конкуренция, рейдерство, мошенничество, давление, утечка информации). Правовая основа: Конституция (ст. 34 — свобода предпринимательства), ГК РФ, законы о защите конкуренции, о коммерческой тайне, о персональных данных. Реализуется через службы безопасности, договорную работу, проверку контрагентов, страхование и управление рисками."}, {"id": 102, "text": "Правовое регулирование предпринимательской деятельности в особых экономических зонах.", "topic": "Хозяйственное право", "quiz": {"q": "Особая экономическая зона (ОЭЗ) — это территория с:", "options": ["особым (льготным) режимом ведения предпринимательской деятельности", "полным запретом бизнеса", "закрытым въездом", "повышенными налогами"], "correct": 0, "explain": "ОЭЗ (ФЗ № 116-ФЗ) — территория с особым режимом предпринимательства: налоговые, таможенные и административные льготы для резидентов."}, "flash": "Правовое регулирование предпринимательства в особых экономических зонах — ФЗ от 22.07.2005 № 116-ФЗ. ОЭЗ — часть территории РФ с особым режимом ведения предпринимательской деятельности: налоговые и таможенные льготы (свободная таможенная зона), упрощённые административные процедуры для резидентов. Типы ОЭЗ: промышленно-производственные, технико-внедренческие, туристско-рекреационные, портовые. Цель — привлечение инвестиций, развитие отраслей и территорий. Создание ОЭЗ — инструмент региональной экономической политики и укрепления ЭБ территорий."}, {"id": 103, "text": "Правовое регулирование малого предпринимательства. Государственная поддержка.", "topic": "Хозяйственное право", "quiz": {"q": "Государственная поддержка малого предпринимательства регулируется:", "options": ["Уголовным кодексом", "ФЗ № 209-ФЗ «О развитии малого и среднего предпринимательства в РФ»", "Трудовым кодексом", "Законом о рекламе"], "correct": 1, "explain": "Базовый акт — ФЗ от 24.07.2007 № 209-ФЗ; поддержка: финансовая, имущественная, информационная, консультационная."}, "flash": "Правовое регулирование малого предпринимательства — ФЗ от 24.07.2007 № 209-ФЗ. Критерии отнесения к МСП: численность работников, доход, структура капитала. Формы господдержки: финансовая (субсидии, льготные кредиты, гарантии), имущественная (льготная аренда), информационная и консультационная, поддержка в сфере закупок (квоты для МСП в госзакупках), налоговые спецрежимы (УСН, ПСН). Развитие МСП укрепляет экономику, повышает занятость и устойчивость — фактор ЭБ государства и регионов."}, {"id": 104, "text": "Сущность рисков, современные подходы к классификации рисков.", "topic": "Риски", "quiz": {"q": "Риск в экономике — это:", "options": ["фиксированный доход", "гарантированная прибыль", "отсутствие неопределённости", "вероятность наступления неблагоприятного события и связанных с ним потерь"], "correct": 3, "explain": "Риск — вероятность (возможность) возникновения неблагоприятных последствий (потерь, убытков) в условиях неопределённости."}, "flash": "Риск — возможность (вероятность) возникновения неблагоприятного события и связанных с ним потерь в условиях неопределённости. Подходы к классификации: по сфере (производственные, коммерческие, финансовые, инвестиционные); по характеру последствий (чистые — только потери; спекулятивные — потери или выгода); по источнику (внутренние, внешние); по уровню (допустимые, критические, катастрофические). Управление рисками (риск-менеджмент) — обязательный элемент ЭБ предприятия, направленный на идентификацию, оценку и минимизацию угроз."}, {"id": 105, "text": "Методы оценки системы управления рисками.", "topic": "Риски", "quiz": {"q": "Методы оценки риска делятся на:", "options": ["качественные и количественные", "только бухгалтерские", "только интуитивные", "только качественные"], "correct": 0, "explain": "Оценка риска: качественные методы (экспертные, ранжирование) и количественные (статистические, VaR, анализ чувствительности)."}, "flash": "Методы оценки системы управления рисками: качественные (экспертные оценки, метод аналогий, ранжирование, построение карты рисков, SWOT) — определяют виды и значимость рисков; количественные (статистический метод, анализ чувствительности, сценарный анализ, метод Монте-Карло, VaR — стоимость под риском) — измеряют вероятность и величину потерь. Оценка системы риск-менеджмента включает анализ её организации, регламентов, эффективности контрольных процедур. Адекватная оценка рисков — основа их минимизации и обеспечения ЭБ."}, {"id": 106, "text": "Диагностика рисков: идентификация и оценка. Этапы процесса оценки рисков.", "topic": "Риски", "quiz": {"q": "Первым этапом процесса управления риском является:", "options": ["ликвидация фирмы", "страхование", "идентификация (выявление) рисков", "выплата убытков"], "correct": 2, "explain": "Процесс: идентификация → оценка (анализ) → выбор методов воздействия → реализация → мониторинг."}, "flash": "Диагностика рисков — процесс их выявления и оценки. Этапы процесса управления риском: 1) идентификация (выявление) рисков и их источников; 2) оценка (анализ) — определение вероятности и величины возможных потерь; 3) выбор методов воздействия (избежание, снижение, передача/страхование, принятие); 4) реализация выбранных мер; 5) мониторинг и контроль результатов. Идентификация — первый и базовый этап: невыявленным риском нельзя управлять. Систематическая диагностика рисков — ключевая функция службы ЭБ."}, {"id": 107, "text": "Экономические, правовые и финансовые аспекты предпринимательских рисков.", "topic": "Риски", "quiz": {"q": "Способами воздействия на предпринимательский риск являются:", "options": ["только повышение цен", "избежание, снижение, передача (страхование), принятие", "только игнорирование", "только банкротство"], "correct": 1, "explain": "Основные методы: избежание (отказ от рисковой операции), снижение (диверсификация, контроль), передача (страхование, аутсорсинг), принятие (резервирование)."}, "flash": "Предпринимательский риск — риск, возникающий при осуществлении хозяйственной деятельности, вероятность потери ресурсов или недополучения доходов. Экономический аспект — возможные убытки; правовой — ответственность и договорные риски; финансовый — потеря платёжеспособности и доходности. Способы оценки: статистический, экспертный, расчётно-аналитический. Методы управления: избежание, снижение (диверсификация, лимитирование, внутренний контроль), передача (страхование, хеджирование, аутсорсинг), принятие с резервированием средств. Управление предпринимательскими рисками — основа финансовой устойчивости и ЭБ."}, {"id": 108, "text": "Понятия аудита и аудиторской деятельности, цели, задачи, значение.", "topic": "Аудит", "quiz": {"q": "Аудит по ФЗ № 307-ФЗ — это:", "options": ["ревизия налоговым органом", "налоговая проверка", "независимая проверка бухгалтерской (финансовой) отчётности для выражения мнения о её достоверности", "оценка имущества"], "correct": 2, "explain": "Аудит — независимая проверка бухгалтерской (финансовой) отчётности аудируемого лица в целях выражения мнения о её достоверности (ФЗ № 307-ФЗ)."}, "flash": "Аудит (ФЗ от 30.12.2008 № 307-ФЗ) — независимая проверка бухгалтерской (финансовой) отчётности аудируемого лица в целях выражения мнения о её достоверности. Цель — повышение доверия пользователей к отчётности. Задачи: проверка достоверности, соответствия законодательству, оценка системы внутреннего контроля. Виды: обязательный (для определённых организаций) и инициативный; внешний и внутренний. Сопутствующие услуги: обзорные проверки, согласованные процедуры. Аудит ведётся по международным стандартам аудита (МСА). Значение — защита интересов собственников, инвесторов, государства и обеспечение ЭБ."}, {"id": 109, "text": "Основные направления аудита: банковский, страховых организаций, бирж и фондов, общий аудит.", "topic": "Аудит", "quiz": {"q": "Аудит, проверяющий отчётность кредитных организаций, называется:", "options": ["технический аудит", "экологический аудит", "кадровый аудит", "банковский аудит"], "correct": 3, "explain": "Банковский аудит — проверка отчётности кредитных организаций; имеет отраслевую специфику."}, "flash": "Основные направления аудиторских проверок по объекту: банковский аудит (кредитные организации, с учётом требований Банка России); аудит страховых организаций и обществ взаимного страхования; аудит бирж, внебюджетных фондов и инвестиционных институтов; общий аудит (прочие организации). Каждое направление имеет отраслевую специфику нормативного регулирования и методики. Обязательному аудиту подлежат, в частности, ПАО, банки, страховщики, организации с превышением установленных показателей выручки и активов. Это обеспечивает достоверность отчётности в значимых секторах."}, {"id": 110, "text": "Структура и функции органов регулирования аудита в РФ. Законодательство об аудите.", "topic": "Аудит", "quiz": {"q": "Государственное регулирование аудиторской деятельности в РФ осуществляет:", "options": ["Министерство спорта", "Роскосмос", "Министерство финансов РФ", "Росреестр"], "correct": 2, "explain": "Уполномоченный федеральный орган — Минфин России; аудиторы объединены в саморегулируемую организацию (СРО ААС)."}, "flash": "Структура регулирования аудита в РФ: уполномоченный федеральный орган — Минфин России (государственная политика, ведение реестров); Совет по аудиторской деятельности при Минфине (совещательный орган); саморегулируемая организация аудиторов (СРО ААС) — обязательное членство, контроль качества, реестр аудиторов. С 2022 года надзор за аудиторами общественно значимых организаций усилен (Банк России, Казначейство). Законодательство: ФЗ № 307-ФЗ, международные стандарты аудита (МСА), Кодекс профессиональной этики аудиторов."}, {"id": 111, "text": "Аудиторская тайна. Взаимоотношения аудиторов с клиентами и органами.", "topic": "Аудит", "quiz": {"q": "Аудиторская тайна — это:", "options": ["коммерческая реклама", "режим конфиденциальности сведений, полученных при оказании аудиторских услуг", "обязанность раскрывать все данные клиента", "открытая информация"], "correct": 1, "explain": "Аудиторская тайна (ст. 9 ФЗ № 307-ФЗ) — конфиденциальность сведений и документов, полученных при оказании аудиторских услуг."}, "flash": "Аудиторская тайна (ст. 9 ФЗ № 307-ФЗ) — обязанность аудиторской организации и аудиторов сохранять конфиденциальность любых сведений и документов, полученных при оказании услуг, кроме разглашаемых самим клиентом или по закону. Передача сведений третьим лицам допускается только в случаях, прямо предусмотренных законом. Взаимоотношения с клиентами строятся на договоре оказания аудиторских услуг и принципах независимости и объективности; с государственными и правоохранительными органами — в рамках, установленных законом. Нарушение тайны влечёт ответственность."}, {"id": 112, "text": "Права и обязанности аудиторских организаций, аудиторов и аудируемых лиц.", "topic": "Аудит", "quiz": {"q": "Аудиторская организация обязана:", "options": ["составлять отчётность за клиента", "скрывать выявленные нарушения", "гарантировать прибыль клиента", "быть независимой и соблюдать профессиональную этику и стандарты"], "correct": 3, "explain": "Аудитор обязан соблюдать независимость, стандарты аудита и этику, обеспечивать качество и хранить аудиторскую тайну."}, "flash": "Права аудиторов (ст. 13 ФЗ № 307-ФЗ): самостоятельно определять методы, проверять документацию, получать разъяснения, отказаться от проверки при непредоставлении документов. Обязанности (ст. 13): проводить аудит по стандартам (МСА), обеспечивать сохранность документов, хранить аудиторскую тайну, быть независимыми, сообщать о признаках недостоверности. Аудируемые лица обязаны содействовать проверке, предоставлять документы, не ограничивать круг вопросов и не предпринимать действий по сокрытию информации. Баланс прав и обязанностей обеспечивает качество и независимость аудита."}, {"id": 113, "text": "Аналитические процедуры в аудите: методы анализа, экспресс-диагностика, тест средств контроля.", "topic": "Аудит", "quiz": {"q": "Аналитические процедуры в аудите — это:", "options": ["оценка финансовой информации через изучение соотношений и выявление отклонений", "только пересчёт всех документов", "инвентаризация склада", "допрос сотрудников"], "correct": 0, "explain": "Аналитические процедуры — анализ соотношений и тенденций показателей для выявления необычных отклонений, требующих внимания аудитора."}, "flash": "Аналитические процедуры (МСА 520) — оценка финансовой информации путём анализа взаимосвязей между показателями, сравнения с ожидаемыми значениями, выявления необычных колебаний. Методы экономического анализа в аудите: горизонтальный, вертикальный, коэффициентный, факторный анализ, оценка ликвидности, платёжеспособности, кредитоспособности. Экспресс-диагностика проводится при заключении договора для оценки риска. Контрольная процедура и тест средств контроля проверяют надёжность системы внутреннего контроля. Аналитические процедуры повышают эффективность аудита и помогают выявлять искажения и мошенничество."}, {"id": 114, "text": "Незаконные получение и разглашение сведений, составляющих коммерческую, налоговую или банковскую тайну.", "topic": "Уголовное право", "quiz": {"q": "Незаконное получение и разглашение сведений, составляющих коммерческую, налоговую или банковскую тайну, квалифицируется по статье УК РФ:", "options": ["ст. 158 УК РФ", "ст. 105 УК РФ", "ст. 264 УК РФ", "ст. 183 УК РФ"], "correct": 3, "explain": "Незаконные получение и разглашение коммерческой, налоговой или банковской тайны — ст. 183 УК РФ."}, "flash": "Незаконные получение и разглашение сведений, составляющих коммерческую, налоговую или банковскую тайну (ст. 183 УК РФ). Часть 1 — собирание сведений путём похищения документов, подкупа, угроз, иным незаконным способом; часть 2 — незаконные разглашение или использование таких сведений лицом, которому они были доверены по службе или работе. Квалифицирующие признаки: крупный ущерб, корыстная заинтересованность, тяжкие последствия. Объект — отношения по защите конфиденциальной информации. Правовая база защиты: ФЗ № 98-ФЗ «О коммерческой тайне». Это прямая угроза информационной составляющей ЭБ предприятия; противодействие — режим тайны, контрразведывательные меры, проверка персонала."}, {"id": 115, "text": "Общая характеристика преступлений против безопасности государства.", "topic": "Уголовное право", "quiz": {"q": "Преступления против безопасности государства посягают на:", "options": ["правила дорожного движения", "экологию", "основы конституционного строя, обороноспособность и суверенитет государства", "имущество граждан"], "correct": 2, "explain": "Объект — внешняя и внутренняя безопасность государства, его конституционный строй и суверенитет (гл. 29 УК РФ)."}, "flash": "Преступления против безопасности государства (гл. 29 УК РФ) посягают на основы конституционного строя, суверенитет, территориальную целостность и обороноспособность РФ. Включают: государственную измену (ст. 275), шпионаж (ст. 276), посягательство на жизнь государственного деятеля (ст. 277), насильственный захват власти (ст. 278), вооружённый мятеж (ст. 279), диверсию (ст. 281), возбуждение ненависти (ст. 282), разглашение государственной тайны (ст. 283). Это особо опасные деяния с высокой степенью угрозы. Многие связаны с подрывом экономики (диверсия против объектов инфраструктуры), поэтому относятся к высшим угрозам национальной и экономической безопасности."}, {"id": 116, "text": "Методика расследования преступлений в сфере экономической деятельности.", "topic": "Уголовное право", "quiz": {"q": "Криминалистическая характеристика экономического преступления — это:", "options": ["система типичных сведений о признаках, способе и обстановке преступления для его раскрытия", "размер штрафа", "приговор суда", "бухгалтерский баланс"], "correct": 0, "explain": "Криминалистическая характеристика — система обобщённых данных о типичных признаках, способах и обстановке преступлений данного вида."}, "flash": "Методика расследования преступлений в сфере экономической деятельности — раздел криминалистики. Элементы: криминалистическая характеристика (типичные способы совершения и сокрытия, предмет посягательства, личность преступника, следовая картина — прежде всего документы); обстоятельства, подлежащие установлению (событие, способ, размер ущерба, виновные лица, умысел); типичные следственные ситуации на начальном этапе (возбуждение по материалам проверок, ревизий, оперативных данных); особенности тактики следственных действий (выемка и осмотр документов, назначение судебно-бухгалтерской и финансово-экономической экспертиз, допросы, обыски). Особенность — ключевая роль документов и экспертиз. Тесно связано с работой подразделений ЭБиПК и служб ЭБ."}, {"id": 117, "text": "Методика расследования преступлений против безопасности государства.", "topic": "Уголовное право", "quiz": {"q": "Особенностью расследования преступлений против безопасности государства является:", "options": ["отсутствие экспертиз", "отсутствие следствия", "ведущая роль органов ФСБ и режим секретности", "рассмотрение в гражданском суде"], "correct": 2, "explain": "Расследование ведётся преимущественно органами ФСБ с соблюдением режима секретности и защиты государственной тайны."}, "flash": "Методика расследования преступлений против безопасности государства. Криминалистическая характеристика: особый объект (безопасность государства), специфические способы (передача сведений иностранным структурам, подрывная деятельность), особая личность субъекта. Обстоятельства, подлежащие установлению: характер сведений или деяния, наличие связи с иностранными организациями, умысел, причинённый или возможный ущерб. Типичные следственные ситуации часто формируются по результатам контрразведывательной деятельности. Особенности тактики: ведущая роль органов ФСБ, режим секретности, защита государственной тайны, специальные экспертизы. Эти преступления — высшая степень угрозы национальной безопасности."}, {"id": 118, "text": "Маркетинг как элемент системы экономической безопасности.", "topic": "ЭБ предприятия", "quiz": {"q": "Маркетинг в системе ЭБ предприятия помогает:", "options": ["выявлять рыночные угрозы и возможности, поддерживать конкурентоспособность", "нарушать закон", "скрывать доходы", "уклоняться от налогов"], "correct": 0, "explain": "Маркетинг обеспечивает анализ рынка и конкурентов, выявление угроз и возможностей — основу рыночной устойчивости и ЭБ."}, "flash": "Маркетинг как элемент системы ЭБ обеспечивает рыночную устойчивость предприятия. Через анализ рынка, потребителей и конкурентов маркетинг выявляет внешние угрозы (падение спроса, действия конкурентов, изменение конъюнктуры) и возможности, поддерживает конкурентоспособность и долю рынка. Маркетинговые исследования пересекаются с конкурентной разведкой. Угрозы, связанные с маркетингом: недобросовестная конкуренция, демпинг, антиреклама, утрата рыночных позиций. Эффективная маркетинговая политика — фактор обеспечения экономической устойчивости и безопасности бизнеса."}, {"id": 119, "text": "Этапы формирования ценовой политики. Методы ценообразования (издержки, конкуренция, спрос).", "topic": "ЭБ предприятия", "quiz": {"q": "Метод ценообразования «средние издержки плюс прибыль» ориентирован на:", "options": ["государственное регулирование", "конкурентов", "собственные издержки", "спрос"], "correct": 2, "explain": "Затратный метод (издержки + наценка) ориентирован на собственные издержки; есть также методы, ориентированные на спрос и на конкуренцию."}, "flash": "Ценовая политика — формирование и управление ценами для достижения целей предприятия. Этапы: постановка целей ценообразования, анализ спроса, оценка издержек, анализ цен конкурентов, выбор метода, установление окончательной цены. Методы ценообразования: ориентированные на издержки (средние издержки плюс прибыль, анализ безубыточности); ориентированные на спрос (ценность для потребителя, ценовая дискриминация); ориентированные на конкуренцию (текущих цен, тендерное ценообразование). Обоснованная ценовая политика обеспечивает прибыльность и конкурентоспособность — элемент ЭБ."}, {"id": 120, "text": "Правовое поведение и его виды. Правонарушение: понятие, признаки, виды.", "topic": "Хозяйственное право", "quiz": {"q": "Правонарушение — это:", "options": ["моральный проступок", "только преступление", "любое действие человека", "виновное противоправное общественно вредное деяние, влекущее юридическую ответственность"], "correct": 3, "explain": "Правонарушение — виновное противоправное деяние, за которое предусмотрена юридическая ответственность; делится на преступления и проступки."}, "flash": "Правовое поведение — поведение, урегулированное нормами права; виды: правомерное и неправомерное (правонарушение). Правонарушение — виновное противоправное общественно вредное деяние деликтоспособного лица, влекущее юридическую ответственность. Признаки: противоправность, виновность, общественная вредность, наказуемость. Виды: преступления (уголовные) и проступки (административные, гражданские, дисциплинарные). Состав правонарушения: объект, объективная сторона, субъект, субъективная сторона. Классификация важна для правовой составляющей ЭБ."}, {"id": 121, "text": "Административное правонарушение: понятие, признаки, состав и его элементы.", "topic": "Хозяйственное право", "quiz": {"q": "Состав административного правонарушения включает:", "options": ["только вину", "объект, объективную сторону, субъект, субъективную сторону", "только деяние", "истца и ответчика"], "correct": 1, "explain": "Как и состав преступления — четыре элемента: объект, объективная сторона, субъект, субъективная сторона (КоАП РФ)."}, "flash": "Административное правонарушение (ст. 2.1 КоАП РФ) — противоправное виновное действие (бездействие) физического или юридического лица, за которое установлена административная ответственность. Признаки: противоправность, виновность, наказуемость, меньшая (чем у преступления) общественная опасность. Состав: объект (охраняемые отношения), объективная сторона (деяние, последствия), субъект (физлицо с 16 лет, должностное лицо, юрлицо), субъективная сторона (вина). Наказания: предупреждение, штраф, конфискация, дисквалификация, приостановление деятельности."}, {"id": 122, "text": "Юридическая ответственность: понятие, признаки, принципы. Юридическая и социальная ответственность.", "topic": "Хозяйственное право", "quiz": {"q": "Юридическая ответственность — это:", "options": ["моральное осуждение", "налоговая льгота", "добровольное возмещение", "применение мер государственного принуждения за правонарушение"], "correct": 3, "explain": "Юридическая ответственность — обязанность претерпеть меры государственного принуждения за совершённое правонарушение."}, "flash": "Юридическая ответственность — применение к правонарушителю мер государственного принуждения, выражающихся в неблагоприятных последствиях. Признаки: основана на правонарушении, устанавливается государством, связана с принуждением и осуждением. Принципы: законность, справедливость, неотвратимость, индивидуализация, недопустимость двойной ответственности. Виды: уголовная, административная, гражданско-правовая, дисциплинарная, материальная. Соотносится с социальной ответственностью как часть и целое. Неотвратимость ответственности — условие эффективной защиты ЭБ."}, {"id": 123, "text": "Борьба с терроризмом: основные понятия, характеристика и тенденции, факторы распространения.", "topic": "ЭБ государства", "quiz": {"q": "Противодействие терроризму в РФ регулируется:", "options": ["ФЗ № 35-ФЗ «О противодействии терроризму»", "Законом о рекламе", "Лесным кодексом", "Законом о связи"], "correct": 0, "explain": "Базовый акт — ФЗ от 06.03.2006 № 35-ФЗ; терроризм финансируется в том числе за счёт теневой экономики."}, "flash": "Терроризм (ФЗ от 06.03.2006 № 35-ФЗ) — идеология насилия и практика воздействия на принятие решений органами власти, связанные с устрашением населения. Современный терроризм характеризуется транснациональностью, использованием ИТ, связью с организованной преступностью и теневым финансированием. Внутренние факторы: социально-экономическое неравенство, безработица, радикализация; внешние: геополитика, деятельность зарубежных центров. Противодействие финансированию терроризма — часть системы ПОД/ФТ (ФЗ № 115-ФЗ). Антитеррористическая защищённость объектов экономики — элемент комплексной безопасности."}, {"id": 124, "text": "Служба безопасности предприятия: задачи, направления, функции.", "topic": "ЭБ предприятия", "quiz": {"q": "Главная задача службы безопасности предприятия — это:", "options": ["защита законных интересов предприятия от внутренних и внешних угроз", "уплата налогов", "ведение бухучёта", "реклама продукции"], "correct": 0, "explain": "СБ предприятия обеспечивает защиту персонала, имущества, информации и экономических интересов от угроз."}, "flash": "Служба безопасности предприятия — подразделение, обеспечивающее комплексную защиту его интересов. Основные задачи: защита персонала, имущества, информации и экономических интересов от угроз. Направления: режим и охрана, информационная безопасность, экономическая безопасность (проверка контрагентов, противодействие мошенничеству), кадровая безопасность, конкурентная разведка и контрразведка. Функции: предупреждение, выявление и пресечение угроз, расследование инцидентов, взаимодействие с правоохранительными органами. Деятельность строится в рамках закона (о частной охранной и детективной деятельности, о коммерческой тайне)."}, {"id": 125, "text": "Комплексное обеспечение внутренней безопасности организации.", "topic": "ЭБ предприятия", "quiz": {"q": "Комплексное обеспечение внутренней безопасности организации означает:", "options": ["охрану только офиса", "системную защиту по всем направлениям (финансы, кадры, информация, имущество)", "защиту только от внешних угроз", "только видеонаблюдение"], "correct": 1, "explain": "Комплексный подход охватывает все составляющие ЭБ во взаимосвязи: финансовую, кадровую, информационную, силовую и др."}, "flash": "Комплексное обеспечение внутренней безопасности — системный подход к защите организации от внутренних угроз по всем направлениям одновременно: финансовая безопасность (контроль операций, предотвращение хищений), кадровая (проверка и контроль персонала), информационная (защита данных и тайны), имущественная (сохранность активов), правовая (соблюдение норм). Принципы: системность, непрерывность, комплексность, законность, разумная достаточность. Реализуется через политику безопасности, регламенты, внутренний контроль и службу безопасности. Внутренние угрозы (от сотрудников) часто опаснее внешних."}, {"id": 126, "text": "Персональные данные. Законодательство РФ о защите персональных данных.", "topic": "Информационная безопасность", "quiz": {"q": "Обработка персональных данных в РФ регулируется:", "options": ["Таможенным кодексом", "Законом о связи", "ФЗ № 152-ФЗ «О персональных данных»", "Законом о рекламе"], "correct": 2, "explain": "Базовый акт — ФЗ от 27.07.2006 № 152-ФЗ; надзор осуществляет Роскомнадзор."}, "flash": "Персональные данные — любая информация, относящаяся к прямо или косвенно определённому физическому лицу. Регулирование — ФЗ от 27.07.2006 № 152-ФЗ. Принципы обработки: законность, ограничение целями, согласие субъекта, конфиденциальность, обеспечение защиты. Оператор обязан принимать организационные и технические меры защиты, локализовать базы ПДн на территории РФ. Надзор — Роскомнадзор. За нарушения — административная (ст. 13.11 КоАП) и уголовная ответственность. Защита ПДн — обязательный элемент информационной безопасности и ЭБ организации."}, {"id": 127, "text": "Мероприятия по пресечению мошенничества со стороны персонала.", "topic": "Кадровая безопасность", "quiz": {"q": "Эффективным средством предупреждения мошенничества со стороны персонала является:", "options": ["сокрытие нарушений", "отсутствие контроля", "разделение полномочий, ротация, внутренний контроль и проверка кадров", "повышение всем зарплаты без условий"], "correct": 2, "explain": "Предупреждают мошенничество: разделение полномочий, внутренний контроль, ротация, проверка персонала, «горячая линия»."}, "flash": "Мероприятия по пресечению мошенничества со стороны персонала: на этапе найма — проверка кандидатов, служба безопасности; в процессе работы — разделение несовместимых полномочий, двойной контроль, ротация кадров, регулярные инвентаризации и сверки, система внутреннего контроля, конфиденциальная «горячая линия» для сообщений, мониторинг операций; при выявлении — служебное расследование, привлечение к материальной и уголовной ответственности (ст. 159, 160 УК РФ). Воздействие на «треугольник мошенничества» (давление, возможность, самооправдание) снижает риски."}, {"id": 128, "text": "Коммерческий подкуп и коммерческий шпионаж. Правовое регулирование и противодействие.", "topic": "ЭБ предприятия", "quiz": {"q": "Коммерческий подкуп квалифицируется по статье УК РФ:", "options": ["ст. 158 УК РФ", "ст. 264 УК РФ", "ст. 204 УК РФ", "ст. 105 УК РФ"], "correct": 2, "explain": "Коммерческий подкуп — ст. 204 УК РФ; незаконное получение коммерческой/налоговой/банковской тайны — ст. 183 УК РФ."}, "flash": "Коммерческий подкуп (ст. 204 УК РФ) — незаконная передача или получение лицом, выполняющим управленческие функции в коммерческой организации, денег или иных выгод за действия в интересах дающего. Коммерческий шпионаж связан с незаконным получением сведений, составляющих коммерческую, налоговую или банковскую тайну (ст. 183 УК РФ). Правовое регулирование: УК РФ, ФЗ № 98-ФЗ «О коммерческой тайне». Противодействие: режим коммерческой тайны, проверка контрагентов и персонала, контрразведывательные меры, антикоррупционная политика. Эти деяния — серьёзные угрозы ЭБ предприятия."}, {"id": 129, "text": "Внутренний аудит и ЭБ в системе противодействия корпоративному мошенничеству.", "topic": "Аудит", "quiz": {"q": "Внутренний аудит в системе противодействия корпоративному мошенничеству:", "options": ["заменяет внешний аудит", "ведёт бухучёт", "независимо оценивает систему внутреннего контроля и выявляет риски мошенничества", "устанавливает цены"], "correct": 2, "explain": "Внутренний аудит — независимая оценка эффективности внутреннего контроля и управления рисками, в т.ч. рисков мошенничества."}, "flash": "Внутренний аудит — независимая деятельность по предоставлению объективных гарантий и консультаций для совершенствования управления, контроля и риск-менеджмента. В системе противодействия корпоративному мошенничеству подразделения внутреннего аудита и экономической безопасности: оценивают эффективность внутреннего контроля, выявляют зоны риска и схемы мошенничества, проводят расследования, разрабатывают рекомендации. Внутренний аудит подчинён совету директоров (комитету по аудиту) для независимости. Вместе со службой ЭБ образует «вторую и третью линии защиты» от мошенничества."}, {"id": 130, "text": "Методика изучения контрагентов.", "topic": "ЭБ предприятия", "quiz": {"q": "Проверка контрагента («должная осмотрительность») включает прежде всего:", "options": ["доверие без проверки", "только устную договорённость", "анализ регистрационных, финансовых и репутационных данных контрагента", "игнорирование информации"], "correct": 2, "explain": "Проверка контрагента: ЕГРЮЛ/ЕГРИП, финансовая отчётность, арбитражные дела, реестры недобросовестных поставщиков, деловая репутация."}, "flash": "Методика изучения контрагентов (должная осмотрительность) — система проверки деловых партнёров для снижения рисков. Этапы: сбор регистрационных данных (ЕГРЮЛ/ЕГРИП, ИНН, учредители, руководитель), анализ финансовой отчётности и платёжеспособности, проверка по реестрам (недобросовестных поставщиков, дисквалифицированных лиц, банкротств, арбитражных дел, исполнительных производств), оценка деловой репутации, проверка полномочий подписантов. Цель — избежать работы с фирмами-однодневками, неплательщиками и мошенниками. Это базовая функция СЭБ и условие налоговой безопасности (ст. 54.1 НК РФ)."}, {"id": 131, "text": "Виды и оценка ошибок и мошенничества в бухучёте и отчётности, выявляемые при проверке.", "topic": "Аудит", "quiz": {"q": "Чем ошибка в бухучёте отличается от мошенничества?", "options": ["ничем", "ошибка непреднамеренна, мошенничество совершается умышленно", "ошибка всегда крупнее", "мошенничество не наказуемо"], "correct": 1, "explain": "Ошибка — непреднамеренное искажение; мошенничество — умышленное искажение с целью извлечения выгоды или введения в заблуждение."}, "flash": "Виды искажений отчётности (МСА 240): ошибки — непреднамеренные искажения (арифметические, неверное применение учётной политики, недосмотр); мошенничество — умышленные действия с целью извлечения выгоды или введения в заблуждение (фальсификация документов, присвоение активов, неправомерное признание доходов/расходов). Признаки мошенничества (red flags): необычные операции, расхождения, обход контроля. Аудитор оценивает риск существенного искажения вследствие мошенничества и планирует процедуры. Выявление искажений защищает пользователей отчётности и обеспечивает ЭБ."}, {"id": 132, "text": "Виды аудиторского риска: приемлемый, внутрихозяйственный, риск средств контроля, риск необнаружения.", "topic": "Аудит", "quiz": {"q": "Аудиторский риск — это:", "options": ["риск потери лицензии", "риск выражения аудитором ненадлежащего мнения по существенно искажённой отчётности", "риск пожара", "риск банкротства клиента"], "correct": 1, "explain": "Аудиторский риск = риск существенного искажения (внутрихозяйственный × средств контроля) × риск необнаружения."}, "flash": "Аудиторский риск — риск того, что аудитор выразит ненадлежащее мнение по существенно искажённой отчётности. Компоненты: приемлемый аудиторский риск (допустимый уровень); неотъемлемый (внутрихозяйственный) риск — подверженность искажениям из-за специфики деятельности; риск средств контроля — риск, что система внутреннего контроля не предотвратит/не выявит искажение; риск необнаружения — риск, что процедуры аудитора не выявят искажение. Модель: АР = НР × РСК × РН. Управляя риском необнаружения (объёмом процедур), аудитор доводит общий риск до приемлемого уровня."}, {"id": 133, "text": "Понятие коррупции. Субъекты коррупционных правонарушений. Принципы и система мер борьбы.", "topic": "ЭБ государства", "quiz": {"q": "Финансовые преступления угрожают экономике государства прежде всего через:", "options": ["рост занятости", "развитие конкуренции", "снижение цен", "подрыв стабильности финансовой системы и отток средств из легального оборота"], "correct": 3, "explain": "Финансовые преступления (мошенничество, отмывание, вывод капитала) дестабилизируют финансовую систему и снижают доверие к ней."}, "flash": "Финансовые преступления — общественно опасные деяния в финансово-кредитной сфере: мошенничество (ст. 159–159.6 УК РФ), легализация доходов (ст. 174, 174.1), незаконная банковская деятельность, фальшивомонетничество, преступления с ценными бумагами, вывод капитала. Риск их совершения влияет на стабильность экономики: подрывает доверие к финансовой системе, сокращает инвестиции, питает теневую экономику, ведёт к потерям бюджета. Противодействие: банковский надзор Банка России, система ПОД/ФТ, работа Росфинмониторинга и правоохранительных органов. Это значимая угроза ЭБ государства."}, {"id": 134, "text": "Предпринимательские риски и способы их оценки.", "topic": "Риски", "quiz": {"q": "Метод оценки риска, основанный на обработке статистических данных о прошлых потерях, — это:", "options": ["метод аналогий", "статистический метод", "интуитивный метод", "экспертный метод"], "correct": 1, "explain": "Статистический метод оценивает риск по частоте и величине потерь в прошлом (дисперсия, стандартное отклонение, коэффициент вариации)."}, "flash": "Предпринимательские риски оцениваются способами: статистический (анализ частоты и величины прошлых потерь, расчёт дисперсии, стандартного отклонения, коэффициента вариации); экспертный (оценки специалистов при недостатке данных); расчётно-аналитический (на основе моделей); метод аналогий (по схожим проектам). Показатели риска: вероятность потерь, ожидаемый убыток, зоны риска (допустимая, критическая, катастрофическая). Выбор метода зависит от наличия данных. Объективная оценка рисков — условие принятия обоснованных решений и обеспечения ЭБ."}, {"id": 135, "text": "Налоговые преступления и их влияние на ЭБ государства.", "topic": "Налоги", "quiz": {"q": "Уклонение организации от уплаты налогов в крупном размере квалифицируется по статье УК РФ:", "options": ["ст. 199 УК РФ", "ст. 105 УК РФ", "ст. 264 УК РФ", "ст. 158 УК РФ"], "correct": 0, "explain": "Уклонение организации от налогов — ст. 199 УК РФ; физлица — ст. 198 УК РФ."}, "flash": "Налоговые преступления (гл. 22 УК РФ): уклонение от уплаты налогов физлицом (ст. 198) и организацией (ст. 199), неисполнение обязанностей налогового агента (ст. 199.1), сокрытие имущества от взыскания (ст. 199.2). Совершаются путём непредставления деклараций или включения ложных сведений в крупном/особо крупном размере. Влияние на ЭБ государства: прямые потери бюджета, недофинансирование расходов, рост теневой экономики, недобросовестная конкуренция. Противодействие: налоговый контроль (ФНС), взаимодействие с СК и МВД, концепция необоснованной налоговой выгоды (ст. 54.1 НК РФ)."}, {"id": 136, "text": "Риск финансовых преступлений и их влияние на стабильность экономики.", "topic": "ЭБ государства", "quiz": {"q": "Финансовая безопасность населения в условиях цифровых платформ зависит прежде всего от:", "options": ["финансовой грамотности и защиты от киберфинансового мошенничества", "роста числа банков", "увеличения наличных", "отказа от безналичных платежей"], "correct": 0, "explain": "Угрозы населению: онлайн-мошенничество, кража данных, закредитованность; защита — грамотность, кибербезопасность, регулирование."}, "flash": "Финансовая безопасность населения — защищённость финансовых интересов граждан. В условиях цифровых финансовых платформ возникают новые угрозы: онлайн-мошенничество (фишинг, социальная инженерия), кража платёжных данных, несанкционированные операции, навязывание кредитов, деятельность финансовых пирамид и нелегальных кредиторов, закредитованность. Защита: повышение финансовой грамотности, кибербезопасность, регулирование Банком России, страхование вкладов, борьба с нелегальными участниками рынка. Финансовая безопасность граждан — социальная составляющая ЭБ государства."}, {"id": 137, "text": "Механизмы противодействия киберпреступности в обеспечении ЭБ.", "topic": "Информационная безопасность", "quiz": {"q": "К механизмам противодействия киберпреступности относится:", "options": ["комплекс правовых, технических и организационных мер (СЗИ, мониторинг, ГосСОПКА)", "отказ от антивирусов", "публикация всех паролей", "отключение от интернета навсегда"], "correct": 0, "explain": "Противодействие киберпреступности — правовые нормы (гл. 28 УК РФ), технические средства защиты, мониторинг и реагирование (ГосСОПКА)."}, "flash": "Киберпреступность — преступления в сфере компьютерной информации и с использованием ИТ: неправомерный доступ (ст. 272 УК РФ), создание вредоносных программ (ст. 273), нарушение правил эксплуатации (ст. 274), мошенничество в сфере компьютерной информации (ст. 159.6), кибератаки на КИИ (ст. 274.1). Механизмы противодействия: правовые (гл. 28 УК РФ, ФЗ № 187-ФЗ о КИИ), технические (средства защиты информации, межсетевые экраны, шифрование, антивирусы), организационные (политики ИБ, обучение, мониторинг, ГосСОПКА, реагирование на инциденты). Это растущая угроза ЭБ."}, {"id": 138, "text": "Легализация преступных доходов и её последствия для экономики государства.", "topic": "ЭБ государства", "quiz": {"q": "Легализация (отмывание) преступных доходов — это:", "options": ["банковский вклад", "придание правомерного вида владению и использованию имущества, полученного преступным путём", "законное инвестирование", "уплата налогов"], "correct": 1, "explain": "Легализация (ст. 174, 174.1 УК РФ) — придание правомерного вида доходам, полученным преступным путём; противодействие — ФЗ № 115-ФЗ."}, "flash": "Легализация (отмывание) доходов — придание правомерного вида владению, пользованию и распоряжению имуществом, полученным преступным путём (ст. 174, 174.1 УК РФ). Стадии: размещени
