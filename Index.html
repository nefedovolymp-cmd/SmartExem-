</html><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Билеты ЭБ">
<meta name="theme-color" content="#0b1f3a">
<title>Билеты · Экономическая безопасность</title>
<style>
 :root{
   --bg:#0b1f3a; --bg2:#0e2747; --card:#13325c; --card2:#10294a;
   --ink:#eaf1fb; --muted:#9fb4d4; --line:rgba(255,255,255,.09);
   --gold:#e7b84e; --gold2:#f0cd77; --green:#34c777; --red:#ff5f6d;
   --blue:#4a8fe7; --shadow:0 12px 34px rgba(0,0,0,.38);
   --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
 }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;padding:0;height:100%}
 body{
   font-family:'Georgia',ui-serif,serif;
   background:
     radial-gradient(120% 80% at 50% -10%, #16386a 0%, transparent 55%),
     linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
   color:var(--ink); overflow:hidden;
   -webkit-font-smoothing:antialiased;
 }
 .app{display:flex;flex-direction:column;height:100dvh;height:100vh}
 /* ---------- Header ---------- */
 header{
   padding:calc(var(--safe-t) + 14px) 18px 12px; flex-shrink:0;
   border-bottom:1px solid var(--line);
   background:linear-gradient(180deg, rgba(11,31,58,.92), rgba(11,31,58,.55));
   backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 }
 .brand{display:flex;align-items:center;gap:11px}
 .crest{width:38px;height:38px;border-radius:10px;flex-shrink:0;
   background:linear-gradient(145deg,var(--gold2),var(--gold));
   display:grid;place-items:center;color:#3a2a06;font-weight:bold;
   font-family:system-ui,sans-serif;font-size:18px;box-shadow:0 4px 12px rgba(231,184,78,.3)}
 .brand h1{font-size:18px;margin:0;letter-spacing:.2px;font-weight:600}
 .brand p{font-size:11.5px;margin:2px 0 0;color:var(--muted);
   font-family:system-ui,sans-serif;letter-spacing:.3px}
 /* ---------- Search ---------- */
 .searchwrap{margin-top:13px;position:relative}
 .searchwrap input{
   width:100%;padding:12px 40px 12px 40px;border-radius:13px;
   border:1px solid var(--line);background:rgba(255,255,255,.07);
   color:var(--ink);font-size:16px;font-family:system-ui,sans-serif;outline:none}
 .searchwrap input::placeholder{color:var(--muted)}
 .searchwrap input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
 .s-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);
   color:var(--muted);font-size:16px;pointer-events:none}
 .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
   width:26px;height:26px;border:none;border-radius:50%;
   background:rgba(255,255,255,.12);color:var(--ink);font-size:15px;
   display:none;cursor:pointer;font-family:system-ui}
 .s-clear.show{display:block}
 /* ---------- Main scroll ---------- */
 main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
   padding:14px 16px calc(var(--safe-b) + 90px)}
 /* topic chips */
 .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;
   scrollbar-width:none;font-family:system-ui,sans-serif}
 .chips::-webkit-scrollbar{display:none}
 .chip{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:13px;
   border:1px solid var(--line);background:rgba(255,255,255,.05);
   color:var(--muted);white-space:nowrap;cursor:pointer;transition:.18s}
 .chip.active{background:linear-gradient(145deg,var(--gold2),var(--gold));
   color:#3a2a06;border-color:transparent;font-weight:600}
 /* question list */
 .qcard{background:linear-gradient(160deg,var(--card),var(--card2));
   border:1px solid var(--line);border-radius:16px;padding:15px 16px;
   margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;
   position:relative;overflow:hidden;transition:transform .12s}
 .qcard:active{transform:scale(.985)}
 .qcard .num{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;
   color:var(--gold);letter-spacing:.5px;display:flex;align-items:center;gap:8px}
 .qcard .topic{font-family:system-ui,sans-serif;font-size:10.5px;
   color:var(--muted);background:rgba(255,255,255,.06);padding:2px 8px;
   border-radius:6px;font-weight:500;letter-spacing:.2px}
 .qcard .qtext{margin:9px 0 0;font-size:15.5px;line-height:1.45}
 .qcard .badge{position:absolute;top:0;right:0;font-family:system-ui,sans-serif;
   font-size:10px;font-weight:700;padding:4px 10px;border-bottom-left-radius:10px;
   letter-spacing:.4px}
 .badge.test{background:rgba(74,143,231,.22);color:#a9cdff}
 .badge.flash{background:rgba(52,199,119,.2);color:#8ff0bd}
 .qcard mark{background:rgba(231,184,78,.32);color:#fff;border-radius:3px;padding:0 1px}
 .empty{text-align:center;color:var(--muted);padding:50px 20px;
   font-family:system-ui,sans-serif;font-size:14px}
 /* ---------- Bottom tabbar ---------- */
 .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;
   padding:8px 14px calc(var(--safe-b) + 8px);gap:8px;
   background:linear-gradient(180deg,rgba(11,31,58,.4),rgba(8,22,42,.96));
   backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
   border-top:1px solid var(--line);z-index:40}
 .tab{flex:1;border:none;border-radius:14px;padding:10px 6px;cursor:pointer;
   background:transparent;color:var(--muted);font-family:system-ui,sans-serif;
   font-size:11px;font-weight:600;display:flex;flex-direction:column;
   align-items:center;gap:4px;transition:.18s}
 .tab .ti{font-size:19px}
 .tab.active{color:var(--gold);background:rgba(231,184,78,.1)}
 /* ---------- Overlay views ---------- */
 .sheet{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
   background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);}
 .sheet.show{display:flex;animation:slideup .28s cubic-bezier(.2,.7,.2,1)}
 @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
 .sheet-head{padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;
   align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-shrink:0;
   background:rgba(11,31,58,.6);backdrop-filter:blur(10px)}
 .sheet-head .back{width:34px;height:34px;border-radius:50%;border:none;
   background:rgba(255,255,255,.1);color:var(--ink);font-size:18px;cursor:pointer;flex-shrink:0}
 .sheet-head h2{font-size:15px;margin:0;font-weight:600;font-family:system-ui,sans-serif}
 .sheet-head .sub{font-size:11px;color:var(--muted);font-family:system-ui,sans-serif;margin-top:1px}
 .sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
   padding:20px 18px calc(var(--safe-b) + 24px)}
 /* detail view */
 .d-num{font-family:system-ui,sans-serif;color:var(--gold);font-weight:700;
   font-size:13px;letter-spacing:.5px}
 .d-q{font-size:19px;line-height:1.5;margin:10px 0 20px;font-weight:600}
 .d-label{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;
   letter-spacing:1px;color:var(--muted);text-transform:uppercase;
   margin:0 0 10px;display:flex;align-items:center;gap:8px}
 .d-label::after{content:'';flex:1;height:1px;background:var(--line)}
 .d-answer{font-size:16px;line-height:1.7;color:#dfe9f8}
 .d-soon{background:rgba(255,255,255,.05);border:1px dashed var(--line);
   border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);
   font-family:system-ui,sans-serif;font-size:14px;line-height:1.6}
 .d-soon b{color:var(--gold2);font-weight:600}
 /* ---------- Quiz mode ---------- */
 .progress{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:4px}
 .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
   border-radius:3px;transition:width .3s}
 .qz-meta{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;
   font-size:12px;color:var(--muted);margin-bottom:18px}
 .qz-q{font-size:18px;line-height:1.5;font-weight:600;margin-bottom:8px}
 .qz-src{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);
   margin-bottom:22px}
 .opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-bottom:11px;
   border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);
   color:var(--ink);font-size:15.5px;line-height:1.4;cursor:pointer;
   font-family:'Georgia',serif;transition:.16s;position:relative}
 .opt:active{transform:scale(.99)}
 .opt .mk{font-family:system-ui,sans-serif;font-weight:700;color:var(--muted);margin-right:10px}
 .opt.correct{border-color:var(--green);background:rgba(52,199,119,.16)}
 .opt.correct .mk{color:var(--green)}
 .opt.wrong{border-color:var(--red);background:rgba(255,95,109,.14)}
 .opt.wrong .mk{color:var(--red)}
 .opt.dim{opacity:.5}
 .explain{background:rgba(74,143,231,.12);border:1px solid rgba(74,143,231,.3);
   border-radius:14px;padding:14px 16px;margin-top:6px;font-size:14.5px;
   line-height:1.6;display:none}
 .explain.show{display:block;animation:fade .3s}
 @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
 .explain .et{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;
   letter-spacing:.6px;color:var(--blue);text-transform:uppercase;margin-bottom:6px}
 .btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;
   font-family:system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer;
   margin-top:18px;transition:.16s}
 .btn:active{transform:scale(.98)}
 .btn-gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#3a2a06;
   box-shadow:0 6px 18px rgba(231,184,78,.28)}
 .btn-ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
 /* flashcard */
 .fc{perspective:1400px;margin-bottom:18px}
 .fc-inner{position:relative;width:100%;min-height:330px;transition:transform .55s;
   transform-style:preserve-3d;cursor:pointer}
 .fc.flipped .fc-inner{transform:rotateY(180deg)}
 .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
   border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;
   justify-content:center;box-shadow:var(--shadow);border:1px solid var(--line)}
 .fc-front{background:linear-gradient(160deg,var(--card),var(--card2))}
 .fc-back{background:linear-gradient(160deg,#14406e,#0f2c50);transform:rotateY(180deg);
   justify-content:flex-start;overflow-y:auto}
 .fc-tag{font-family:system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.6px;
   color:var(--gold);text-transform:uppercase;margin-bottom:14px}
 .fc-front .q{font-size:18px;line-height:1.5;font-weight:600}
 .fc-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;
   font-family:system-ui,sans-serif;font-size:12px;color:var(--muted)}
 .fc-back .a{font-size:15px;line-height:1.65;color:#e6eefb}
 .grade{display:flex;gap:11px}
 .grade button{flex:1;padding:15px;border:none;border-radius:14px;font-weight:600;
   font-family:system-ui,sans-serif;font-size:15px;cursor:pointer}
 .g-no{background:rgba(255,95,109,.18);color:#ff9aa3;border:1px solid rgba(255,95,109,.35)}
 .g-yes{background:rgba(52,199,119,.18);color:#8ff0bd;border:1px solid rgba(52,199,119,.35)}
 /* results */
 .result{text-align:center;padding:30px 10px}
 .result .big{font-size:54px;font-weight:700;font-family:system-ui,sans-serif;
   background:linear-gradient(145deg,var(--gold2),var(--gold));-webkit-background-clip:text;
   background-clip:text;-webkit-text-fill-color:transparent}
 .result .lbl{font-family:system-ui,sans-serif;color:var(--muted);font-size:14px;margin-top:4px}
 .result .msg{font-size:17px;margin:22px 0;line-height:1.5}
 .ring{width:150px;height:150px;margin:10px auto 0}
 /* home hero for tabs */
 .hero{background:linear-gradient(160deg,var(--card),var(--card2));
   border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;
   box-shadow:var(--shadow)}
 .hero h3{margin:0 0 6px;font-size:17px}
 .hero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55;font-family:system-ui,sans-serif}
 .hero .go{margin-top:16px}
 .modepick{display:flex;gap:10px;margin-bottom:14px;font-family:system-ui,sans-serif}
 .modepick button{flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);
   background:rgba(255,255,255,.05);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer}
 .modepick button.on{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#3a2a06;border-color:transparent}
 .stat-row{display:flex;gap:10px;margin-bottom:14px}
 .stat{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);
   border-radius:13px;padding:13px;text-align:center;font-family:system-ui,sans-serif}
 .stat .v{font-size:22px;font-weight:700;color:var(--gold2)}
 .stat .k{font-size:11px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="app">
 <header>
   <div class="brand">
     <div class="crest">ЭБ</div>
     <div>
       <h1>Билеты к госэкзамену</h1>
       <p>38.05.01 · Экономическая безопасность · 140 вопросов</p>
     </div>
   </div>
   <div class="searchwrap" id="searchwrap" style="display:none">
     <span class="s-ic">⌕</span>
     <input id="search" type="search" placeholder="Поиск по билетам: тема, ключевое слово…" autocomplete="off" autocorrect="off">
     <button class="s-clear" id="sclear">✕</button>
   </div>
 </header>
 
 <main id="main"></main>
 
 <nav class="tabbar">
   <button class="tab active" data-tab="browse"><span class="ti">⌕</span>Билеты</button>
   <button class="tab" data-tab="quiz"><span class="ti">✓</span>Тест</button>
   <button class="tab" data-tab="cards"><span class="ti">⇄</span>Карточки</button>
   <button class="tab" data-tab="stats"><span class="ti">▣</span>Прогресс</button>
 </nav>
</div>
 
<!-- Detail sheet -->
<div class="sheet" id="detail">
 <div class="sheet-head">
   <button class="back" onclick="closeDetail()">‹</button>
   <div><h2 id="d-title">Билет</h2><div class="sub" id="d-sub"></div></div>
 </div>
 <div class="sheet-body" id="d-body"></div>
</div>
 
<!-- Quiz sheet -->
<div class="sheet" id="quizsheet">
 <div class="sheet-head">
   <button class="back" onclick="closeQuiz()">‹</button>
   <div><h2>Тест по билетам</h2><div class="sub" id="qz-sub"></div></div>
 </div>
 <div class="sheet-body" id="qz-body"></div>
</div>
 
<!-- Cards sheet -->
<div class="sheet" id="cardsheet">
 <div class="sheet-head">
   <button class="back" onclick="closeCards()">‹</button>
   <div><h2>Карточки</h2><div class="sub" id="fc-sub"></div></div>
 </div>
 <div class="sheet-body" id="fc-body"></div>
</div>
 
<script>
const Q = [{"id": 1, "text": "Значение, задачи и методический инструментарий экономического анализа.", "topic": "Эк. анализ", "quiz": {"q": "Что является базовым приёмом экономического анализа, без которого любой показатель неинформативен?", "options": ["Инвентаризация", "Дисконтирование", "Котировка", "Сравнение"], "correct": 3, "explain": "Сравнение (с планом, прошлым периодом, нормативом, отраслью, конкурентами) — базовый приём: показатель информативен только в сопоставлении."}, "flash": "Экономический анализ — система приёмов изучения хозяйственных процессов для обоснования решений. Задачи: обоснование планов, оценка результатов, измерение факторов, поиск резервов. Инструментарий: сравнение, группировка, балансовый метод, цепные подстановки, индексный, интегральный, экономико-математические методы. Базовый приём — сравнение."}, {"id": 2, "text": "Анализ структуры и динамики затрат на производство и реализацию продукции. Классификация затрат, типовая структура калькуляции, диагностика затрат.", "topic": "Эк. анализ", "quiz": {"q": "Группировка затрат по экономическим элементам показывает:", "options": ["точку безубыточности", "рентабельность продукции", "где и на что израсходованы средства", "что именно израсходовано (по видам ресурсов)"], "correct": 3, "explain": "По элементам (материалы, оплата труда, отчисления, амортизация, прочие) видно ЧТО израсходовано; по статьям калькуляции — ГДЕ и на что."}, "flash": "Себестоимость — затраты в денежной форме на производство и сбыт. Классификация: по элементам (что израсходовано) и по статьям калькуляции (где и на что). Анализ: структура (удельные веса) и динамика; обобщающий показатель — затраты на рубль продукции."}, {"id": 3, "text": "Содержание анализа финансово-хозяйственной деятельности и его место в системе управления предприятием.", "topic": "Эк. анализ", "quiz": {"q": "Какое место занимает анализ в управленческом цикле?", "options": ["между учётом и принятием решений", "вместо контроля", "после регулирования", "заменяет планирование"], "correct": 0, "explain": "Цикл: планирование → организация → учёт → анализ → регулирование. Анализ — связующее звено между учётом и решениями."}, "flash": "АФХД — комплексное изучение всех сторон деятельности. Место: между учётом и принятием решений в управленческом цикле. Результаты — база для обоснования и оптимизации решений; для ЭБ — система раннего предупреждения угроз."}, {"id": 4, "text": "Понятие финансового состояния предприятия. Задачи анализа. Методы: горизонтальный, вертикальный, трендовый, коэффициентный.", "topic": "Эк. анализ", "quiz": {"q": "Какой метод анализа определяет удельный вес каждой статьи в итоге?", "options": ["трендовый", "вертикальный (структурный)", "горизонтальный", "коэффициентный"], "correct": 1, "explain": "Вертикальный анализ — структура (доля статьи в итоге). Горизонтальный — динамика к прошлому периоду, трендовый — тенденция за ряд лет."}, "flash": "Финансовое состояние — состояние капитала в кругообороте и способность к саморазвитию. Задачи: оценка имущества, платёжеспособности, устойчивости, деловой активности, рентабельности, диагностика банкротства. Методы: горизонтальный, вертикальный, трендовый, коэффициентный."}, {"id": 5, "text": "Структурный анализ баланса предприятия. Сопоставление динамики активов с динамикой выручки и прибыли.", "topic": "Эк. анализ", "quiz": {"q": "«Золотое правило экономики предприятия» — это соотношение:", "options": ["прибыль > выручка > активы > 100%", "выручка > прибыль > активы", "капитал = обязательства", "активы > выручка > прибыль"], "correct": 0, "explain": "Темп роста прибыли > выручки > активов > 100%: прибыль растёт быстрее выручки, выручка — быстрее активов, активы растут."}, "flash": "Структурный анализ баланса — вертикальный и горизонтальный анализ активов и пассивов. «Золотое правило»: Тпр.прибыли > Тпр.выручки > Тпр.активов > 100%. Нарушение — сигнал снижения эффективности."}, {"id": 6, "text": "Анализ структуры активов и пассивов. Коэффициенты автономии, соотношения заёмных и собственных средств.", "topic": "Эк. анализ", "quiz": {"q": "Нормативное значение коэффициента автономии (финансовой независимости):", "options": ["≤ 0,1", "≥ 2,0", "ровно 1,0", "≥ 0,5"], "correct": 3, "explain": "Коэффициент автономии = собственный капитал / валюта баланса; норматив ≥ 0,5 — не менее половины имущества за счёт собственных средств."}, "flash": "Активы: внеоборотные/оборотные. Пассивы: собственный/заёмный капитал. Коэффициент автономии = СК/валюта баланса (≥0,5). Коэффициент соотношения заёмных и собственных = ЗК/СК (≤1)."}, {"id": 7, "text": "Типы финансовой устойчивости. Коэффициенты финансовой устойчивости. Анализ оборачиваемости (деловой активности).", "topic": "Эк. анализ", "quiz": {"q": "При каком типе финансовой устойчивости запасы покрываются собственными оборотными средствами и долгосрочными источниками?", "options": ["неустойчивое состояние", "нормальная", "абсолютная", "кризисное состояние"], "correct": 1, "explain": "Нормальная устойчивость — запасы покрываются СОС и долгосрочными источниками, платёжеспособность гарантирована."}, "flash": "Финансовая устойчивость — равновесие активов и пассивов, гарантирующее платёжеспособность. Четыре типа: абсолютная, нормальная, неустойчивое, кризисное. Коэффициенты: автономии (≥0,5), обеспеченности запасов СОС, обеспеченности СОС (≥0,1). Деловая активность — оборачиваемость."}, {"id": 8, "text": "Система показателей в экономическом анализе: стоимостные/натуральные, количественные/качественные, объёмные/удельные.", "topic": "Эк. анализ", "quiz": {"q": "Рентабельность продаж по способу обобщения относится к показателям:", "options": ["удельным (относительным)", "количественным", "объёмным (абсолютным)", "натуральным"], "correct": 0, "explain": "Рентабельность — относительный (удельный) показатель: результат деления одной величины на другую."}, "flash": "Показатели: стоимостные/натуральные (шкала), количественные/качественные (содержание), объёмные (абсолютные)/удельные (относительные). Относительные информативнее для сравнения. Увязываются в факторные модели."}, {"id": 9, "text": "Анализ дебиторской и кредиторской задолженности, основные направления снижения.", "topic": "Эк. анализ", "quiz": {"q": "Что НЕ относится к направлениям снижения дебиторской задолженности?", "options": ["проверка контрагентов и лимиты", "факторинг", "предоплата и банковские гарантии", "увеличение отсрочки всем покупателям"], "correct": 3, "explain": "Увеличение отсрочки наращивает дебиторку. Снижают её: проверка контрагентов, предоплата, гарантии, факторинг, резерв по сомнительным долгам."}, "flash": "Дебиторская задолженность — долги предприятию (отвлечение средств), кредиторская — долги предприятия. Анализ структуры, сроков, просрочки, оборачиваемости. Снижение: проверка контрагентов, предоплата, гарантии, факторинг, резерв по сомнительным долгам, претензионная работа."}, {"id": 10, "text": "Анализ платёжеспособности и ликвидности.", "topic": "Эк. анализ", "quiz": {"q": "Нормативное значение коэффициента текущей ликвидности:", "options": ["1,5–2,0", "≥ 5,0", "0,2–0,5", "0,7–1,0"], "correct": 0, "explain": "Текущая ликвидность = оборотные активы / краткосрочные обязательства, норматив 1,5–2,0. 0,2–0,5 — абсолютная, 0,7–1,0 — быстрая."}, "flash": "Платёжеспособность — способность гасить обязательства; ликвидность — превращение активов в деньги. Группы А1–А4 и П1–П4. Коэффициенты: абсолютной (0,2–0,5), быстрой (0,7–1,0), текущей (1,5–2,0) ликвидности."}, {"id": 11, "text": "Анализ экономического потенциала организации. Методы диагностики: экспертный, балльный, рейтинговый, факторный, экономико-математический, имитационное моделирование.", "topic": "Эк. анализ", "quiz": {"q": "Какой метод диагностики воспроизводит поведение системы при разных сценариях?", "options": ["рейтинговый", "балльный", "имитационное моделирование", "экспертный"], "correct": 2, "explain": "Имитационное моделирование воспроизводит поведение системы при различных сценариях для оценки последствий решений."}, "flash": "Экономический потенциал — ресурсы и способности по их использованию. Оценка: имущественное и финансовое положение. Методы диагностики: экспертный, балльный, рейтинговый, факторный, экономико-математический, имитационное моделирование."}, {"id": 12, "text": "Понятие банкротства. Признаки несостоятельности. Причины. Методы диагностики вероятности банкротства.", "topic": "Эк. анализ", "quiz": {"q": "Юридический признак банкротства юрлица по ФЗ № 127-ФЗ — неисполнение обязательств в течение:", "options": ["1 года", "6 месяцев", "3 месяцев", "1 месяца"], "correct": 2, "explain": "По ФЗ от 26.10.2002 № 127-ФЗ — неисполнение денежных обязательств и обязательных платежей в течение 3 месяцев."}, "flash": "Банкротство — признанная судом неспособность удовлетворить требования кредиторов и уплатить обязательные платежи (ФЗ № 127-ФЗ). Признак — 3 месяца неисполнения. Причины внешние/внутренние. Диагностика: коэффициенты + модели Альтмана, Таффлера, Сайфуллина–Кадыкова."}, {"id": 13, "text": "Основные средства: экономическая сущность, классификация, виды стоимостной оценки.", "topic": "Ресурсы и финансы", "quiz": {"q": "Остаточная стоимость основного средства — это:", "options": ["цена возможной продажи в конце срока", "стоимость воспроизводства в современных условиях", "сумма затрат на приобретение", "первоначальная (восстановительная) минус накопленная амортизация"], "correct": 3, "explain": "Остаточная стоимость = первоначальная (восстановительная) − накопленная амортизация. Учёт ОС — ФСБУ 6/2020."}, "flash": "Основные средства — средства труда >12 мес. (ФСБУ 6/2020). Классификация по видам, назначению, использованию, роли (активная/пассивная часть). Оценка: первоначальная, восстановительная, остаточная, ликвидационная."}, {"id": 14, "text": "Оборотные средства: сущность, классификация, показатели оценки, направления повышения эффективности.", "topic": "Ресурсы и финансы", "quiz": {"q": "Чем оборотные средства отличаются от основных?", "options": ["полностью потребляются за один производственный цикл", "не имеют денежной оценки", "переносят стоимость на продукт постепенно", "служат более 12 месяцев"], "correct": 0, "explain": "Оборотные средства полностью потребляются в одном цикле и целиком переносят стоимость на продукт, в отличие от основных средств."}, "flash": "Оборотные средства — авансированы для оборотных фондов и фондов обращения, потребляются за один цикл. Классификация по сферам, источникам, нормированию, ликвидности. Показатели: коэффициент оборачиваемости, длительность оборота, коэффициент закрепления."}, {"id": 15, "text": "Доходы предприятия: понятие, условия признания, классификация.", "topic": "Ресурсы и финансы", "quiz": {"q": "Доходы организации регулируются положением:", "options": ["ПБУ 9/99", "ПБУ 10/99", "ПБУ 1/2008", "ФСБУ 6/2020"], "correct": 0, "explain": "Доходы — ПБУ 9/99; расходы — ПБУ 10/99; основные средства — ФСБУ 6/2020; учётная политика — ПБУ 1/2008."}, "flash": "Доходы (ПБУ 9/99) — рост экономических выгод, увеличивающий капитал (кроме вкладов собственников). Виды: от обычной деятельности (выручка) и прочие. 5 условий признания выручки: право, сумма, уверенность в выгодах, переход права, определимость расходов."}, {"id": 16, "text": "Расходы организации: понятие и классификация.", "topic": "Ресурсы и финансы", "quiz": {"q": "По элементам расходы по обычным видам деятельности (ПБУ 10/99) НЕ включают:", "options": ["проценты к уплате по кредитам", "материальные затраты", "амортизацию", "затраты на оплату труда"], "correct": 0, "explain": "Проценты к уплате — это прочие расходы. Элементы обычной деятельности: материалы, оплата труда, отчисления, амортизация, прочие затраты."}, "flash": "Расходы (ПБУ 10/99) — уменьшение выгод, снижающее капитал. Виды: по обычным видам деятельности и прочие. По элементам: материалы, оплата труда, отчисления, амортизация, прочие. Фиктивные расходы — способ вывода средств и уклонения от налогов."}, {"id": 17, "text": "Прибыль организации и факторы, влияющие на неё. Резервы увеличения прибыли.", "topic": "Ресурсы и финансы", "quiz": {"q": "Что НЕ является фактором прибыли от продаж в факторном анализе?", "options": ["структура (ассортимент) продукции", "ставка налога на прибыль", "себестоимость единицы", "объём реализации"], "correct": 1, "explain": "Прибыль от продаж зависит от объёма, структуры, себестоимости и цен. Ставка налога влияет на чистую прибыль, а не на прибыль от продаж."}, "flash": "Прибыль — превышение доходов над расходами. Виды: валовая, от продаж, до налогообложения, чистая. Факторы прибыли от продаж: объём, структура, себестоимость, цены. Резервы: рост продаж, снижение себестоимости, оптимизация ассортимента, ценовая политика."}, {"id": 18, "text": "Внутрифирменное бюджетирование. Система бюджетов фирмы.", "topic": "Ресурсы и финансы", "quiz": {"q": "Какой бюджет показывает ликвидность и кассовые разрывы?", "options": ["бюджет движения денежных средств (БДДС)", "бюджет продаж", "бюджет доходов и расходов (БДР)", "прогнозный баланс"], "correct": 0, "explain": "БДДС отражает денежные потоки, ликвидность и кассовые разрывы. БДР — прибыльность, прогнозный баланс — будущее финансовое состояние."}, "flash": "Бюджетирование — технология финансового планирования через систему бюджетов. Функции: планирование, координация, мотивация, контроль. Операционные бюджеты + финансовые (БДР — прибыль, БДДС — ликвидность, прогнозный баланс). План-факт анализ — основа контроля."}, {"id": 19, "text": "Функции и роль инвестиций, классификация инвестиций.", "topic": "Инвестиции", "quiz": {"q": "Прямые инвестиции отличаются от портфельных тем, что:", "options": ["не приносят прибыли", "вкладываются только в ценные бумаги", "предполагают участие в управлении/контроль", "всегда краткосрочны"], "correct": 2, "explain": "Прямые инвестиции — непосредственное вложение с участием в управлении (контролем); портфельные — без участия в управлении."}, "flash": "Инвестиции (ФЗ № 39-ФЗ) — вложения в объекты деятельности ради прибыли/эффекта. Роль: рост, обновление, конкурентоспособность. Классификация: реальные/финансовые, прямые/портфельные, по сроку, форме собственности, риску."}, {"id": 20, "text": "Инвестиционная деятельность: понятие, объекты, субъекты, особенности.", "topic": "Инвестиции", "quiz": {"q": "Кто из субъектов инвестиционной деятельности обеспечивает целевое использование вложенных средств?", "options": ["подрядчик", "пользователь объекта", "инвестор", "проектировщик"], "correct": 2, "explain": "Инвестор вкладывает средства (собственные, заёмные, привлечённые) и обеспечивает их целевое использование (ФЗ № 39-ФЗ)."}, "flash": "Инвестиционная деятельность — вложение инвестиций и практические действия ради прибыли. Объекты: ОС, оборотный капитал, ценные бумаги, НИОКР. Субъекты: инвесторы, заказчики, подрядчики, пользователи. Особенности: лаг, риск, капиталоёмкость, фактор времени."}, {"id": 21, "text": "Эффективность реального инвестиционного проекта: понятие, система показателей, программно-методическое обеспечение.", "topic": "Инвестиции", "quiz": {"q": "Проект эффективен, если чистый дисконтированный доход (NPV):", "options": ["NPV < 0", "NPV > 0", "NPV не считается", "NPV = 0"], "correct": 1, "explain": "Проект эффективен при NPV > 0. IRR должен превышать стоимость капитала, индекс доходности PI > 1."}, "flash": "Эффективность проекта — соответствие результатов затратам. Методы статические (срок окупаемости, норма прибыли) и динамические. NPV>0, IRR>стоимости капитала, PI>1, дисконтированный срок окупаемости. Основа — «Методические рекомендации»."}, {"id": 22, "text": "Принципы и методы оценки эффективности инвестпроектов. Жизненный цикл проекта.", "topic": "Инвестиции", "quiz": {"q": "На какой фазе жизненного цикла проекта разрабатывают ТЭО и бизнес-план?", "options": ["прединвестиционной", "ликвидационной", "эксплуатационной", "инвестиционной"], "correct": 0, "explain": "Прединвестиционная фаза: идея, исследования, ТЭО, бизнес-план, инвестрешение. Затем инвестиционная (вложения) и эксплуатационная (доходы)."}, "flash": "Принципы оценки: весь жизненный цикл, моделирование потоков, сопоставимость, фактор времени, учёт инфляции и рисков. Методы: статические и динамические (NPV, IRR, PI, DPP, MIRR). Жизненный цикл: прединвестиционная → инвестиционная → эксплуатационная фазы."}, {"id": 23, "text": "Система налогов и сборов в Российской Федерации.", "topic": "Налоги", "quiz": {"q": "Сколько уровней включает система налогов и сборов в РФ?", "options": ["Два (федеральный и местный)", "Четыре", "Три (федеральные, региональные, местные)", "Один (только федеральный)"], "correct": 2, "explain": "Система трёхуровневая (ст. 12 НК РФ): федеральные, региональные и местные налоги и сборы."}, "flash": "Система налогов и сборов РФ установлена НК РФ и трёхуровнева (ст. 12): федеральные (НДС, акцизы, НДФЛ, налог на прибыль, НДПI, водный, госпошлина), региональные (налог на имущество организаций, транспортный, на игорный бизнес), местные (земельный, на имущество физлиц, торговый сбор). Налог — обязательный индивидуально безвозмездный платёж; сбор взимается за юридически значимые действия. Действуют и специальные налоговые режимы (УСН, ПСН, ЕСХН, АУСН, НПД)."}, {"id": 24, "text": "Налогоплательщики. Плательщики сборов, взносов. Представительство. Исполнение обязанности по уплате налогов.", "topic": "Налоги", "quiz": {"q": "Кто признаётся налогоплательщиком по НК РФ?", "options": ["Только налоговые органы", "Только ИП", "Только организации", "Организации и физические лица, на которых возложена обязанность уплачивать налоги"], "correct": 3, "explain": "Налогоплательщики (ст. 19 НК РФ) — организации и физлица, на которых возложена обязанность уплачивать налоги и сборы."}, "flash": "Налогоплательщики (ст. 19 НК РФ) — организации и физические лица, обязанные уплачивать налоги; аналогично определяются плательщики сборов и страховых взносов. Представительство бывает законным (по закону/учредительным документам) и уполномоченным (по доверенности). Обязанность по уплате исполняется самостоятельно, в установленный срок, может исполняться досрочно; основания возникновения, изменения и прекращения — глава 8 НК РФ. С 2023 года уплата идёт через единый налоговый счёт (ЕНС) и единый налоговый платёж (ЕНП)."}, {"id": 25, "text": "Виды налогов.", "topic": "Налоги", "quiz": {"q": "По уровню установления налоги делятся на:", "options": ["окладные и раскладочные", "прямые и косвенные", "федеральные, региональные и местные", "разовые и периодические"], "correct": 2, "explain": "По уровню — федеральные, региональные, местные. Прямые/косвенные — это деление по способу взимания."}, "flash": "Виды налогов классифицируют: по уровню — федеральные, региональные, местные; по способу взимания — прямые (на доход и имущество: налог на прибыль, НДФЛ) и косвенные (включаются в цену: НДС, акцизы); по субъекту — с организаций, с физлиц, смешанные; по назначению — общие и целевые; по источнику уплаты. Косвенные налоги фактически уплачивает конечный потребитель. Деление важно для анализа налоговой нагрузки и выявления схем уклонения."}, {"id": 26, "text": "Сущность, цели и задачи налогового контроля. Учёт налогоплательщиков.", "topic": "Налоги", "quiz": {"q": "Налоговый контроль проводится прежде всего в форме:", "options": ["камеральных и выездных налоговых проверок", "социального опроса", "аудиторских проверок", "инвентаризации"], "correct": 0, "explain": "Основные формы — камеральная (по отчётности, без выезда) и выездная (на территории налогоплательщика) проверки (ст. 88, 89 НК РФ)."}, "flash": "Налоговый контроль (гл. 14 НК РФ) — деятельность уполномоченных органов по контролю за соблюдением налогового законодательства. Цель — обеспечение полноты и своевременности уплаты налогов; задачи — предупреждение, выявление и пресечение нарушений. Основа контроля — учёт налогоплательщиков (постановка на учёт, ИНН, ЕГРН). Формы: камеральные и выездные проверки, получение объяснений, осмотр, инвентаризация, налоговый мониторинг. Эффективный контроль — элемент экономической безопасности государства."}, {"id": 27, "text": "Налоговые правонарушения и ответственность за их совершение.", "topic": "Налоги", "quiz": {"q": "Налоговое правонарушение по НК РФ — это:", "options": ["административный проступок", "только уклонение в крупном размере", "виновно совершённое противоправное деяние, за которое НК РФ установлена ответственность", "любая неуплата налога без вины"], "correct": 2, "explain": "Ст. 106 НК РФ: виновно совершённое противоправное деяние налогоплательщика, за которое установлена ответственность."}, "flash": "Налоговое правонарушение (ст. 106 НК РФ) — виновно совершённое противоправное деяние, за которое НК РФ установлена ответственность. Виды: непостановка на учёт, непредставление декларации, грубое нарушение правил учёта, неуплата/неполная уплата налога (ст. 122), невыполнение обязанностей налогового агента. Санкции — штрафы. За крупные и особо крупные размеры наступает уголовная ответственность (ст. 198–199 УК РФ). Налоговые преступления — значимая угроза экономической безопасности государства."}, {"id": 28, "text": "Правовое регулирование экономической безопасности в РФ.", "topic": "ЭБ государства", "quiz": {"q": "Какой документ является базовым стратегическим актом в сфере экономической безопасности РФ?", "options": ["Стратегия экономической безопасности РФ до 2030 года (Указ № 208)", "Трудовой кодекс РФ", "Гражданский кодекс РФ", "Налоговый кодекс РФ"], "correct": 0, "explain": "Базовый акт — Стратегия ЭБ РФ до 2030 года (Указ Президента РФ от 13.05.2017 № 208)."}, "flash": "Правовое регулирование ЭБ в РФ образует иерархию: Конституция РФ; ФЗ от 28.12.2010 № 390-ФЗ «О безопасности»; Стратегия национальной безопасности РФ (Указ № 400 от 03.07.2021); Стратегия экономической безопасности РФ до 2030 года (Указ № 208 от 13.05.2017); отраслевые законы (о банках, о валютном регулировании, о противодействии легализации доходов — № 115-ФЗ) и подзаконные акты. Эти документы определяют национальные интересы, угрозы и механизмы их нейтрализации."}, {"id": 29, "text": "Стратегия национальной безопасности РФ (Указ Президента РФ от 03.07.2021 № 400).", "topic": "ЭБ государства", "quiz": {"q": "Указ Президента РФ от 03.07.2021 № 400 утвердил:", "options": ["Концепцию миграционной политики", "Стратегию национальной безопасности РФ", "Стратегию экономической безопасности", "Налоговый кодекс"], "correct": 1, "explain": "Указ № 400 от 03.07.2021 утвердил Стратегию национальной безопасности РФ."}, "flash": "Стратегия национальной безопасности РФ (Указ № 400 от 03.07.2021) — базовый документ стратегического планирования. Определяет национальные интересы и стратегические национальные приоритеты, среди которых — экономическая безопасность. Экономическая безопасность рассматривается как условие суверенитета и устойчивого развития. Стратегия задаёт цели: повышение устойчивости экономики к угрозам, технологический суверенитет, снижение зависимости от импорта, защита от санкционного давления."}, {"id": 30, "text": "Стратегия экономической безопасности РФ на период до 2030 года (Указ Президента РФ от 13.05.2017 № 208).", "topic": "ЭБ государства", "quiz": {"q": "На какой период рассчитана Стратегия экономической безопасности РФ (Указ № 208)?", "options": ["до 2024 года", "до 2030 года", "до 2035 года", "бессрочно"], "correct": 1, "explain": "Стратегия ЭБ РФ рассчитана на период до 2030 года (Указ Президента РФ от 13.05.2017 № 208)."}, "flash": "Стратегия ЭБ РФ до 2030 года (Указ № 208 от 13.05.2017) реализуется в два этапа. Определяет вызовы и угрозы ЭБ (среди них — отставание в технологиях, сырьевая модель, отток капитала, неравенство, санкции), цели, основные направления госполитики и индикаторы состояния ЭБ. Цель — противодействие угрозам, обеспечение устойчивого роста, экономического суверенитета и единства экономического пространства. Это ключевой ориентир для всей системы обеспечения ЭБ."}, {"id": 31, "text": "Экономическая безопасность государства и её виды. Факторы, влияющие на ЭБ государства.", "topic": "ЭБ государства", "quiz": {"q": "Что относится к ВИДАМ экономической безопасности государства?", "options": ["только информационная", "только военная безопасность", "только кадровая", "финансовая, энергетическая, продовольственная, внешнеэкономическая и др."], "correct": 3, "explain": "Виды ЭБ государства: финансовая, энергетическая, продовольственная, внешнеэкономическая, технологическая, социальная и др."}, "flash": "Экономическая безопасность государства — состояние защищённости национальной экономики от внутренних и внешних угроз, обеспечивающее суверенитет, устойчивость и развитие. Виды: финансовая, энергетическая, продовольственная, внешнеэкономическая, технологическая (научно-техническая), социальная, информационная. Факторы влияния: внутренние (структура экономики, инвестиции, инновации, теневая экономика, коррупция) и внешние (мировые цены, санкции, конкуренция, глобализация). Угрозы делят на реальные и потенциальные."}, {"id": 32, "text": "Государственные и негосударственные органы управления экономической безопасностью РФ.", "topic": "ЭБ государства", "quiz": {"q": "Центральный банк РФ в системе обеспечения ЭБ является органом:", "options": ["негосударственным", "международным", "коммерческим", "осуществляющим денежно-кредитную политику и надзор"], "correct": 3, "explain": "Банк России — государственный орган денежно-кредитного регулирования и банковского надзора, ключевой субъект финансовой безопасности."}, "flash": "Управление ЭБ ведут государственные органы: Президент и Совет Безопасности РФ (определяют политику), Правительство, Минэкономразвития, Минфин, ФНС, ФТС, Банк России (денежно-кредитная политика, надзор), Росфинмониторинг (ПОД/ФТ), правоохранительные органы (МВД, ФСБ, СК, прокуратура), Счётная палата (внешний госаудит). Негосударственные субъекты: службы безопасности предприятий, СРО, аудиторские и охранные организации, общественные объединения. Все вместе образуют систему обеспечения ЭБ."}, {"id": 33, "text": "Критерии, индикаторы и показатели экономической безопасности государства.", "topic": "ЭБ государства", "quiz": {"q": "Пороговое значение индикатора экономической безопасности — это:", "options": ["среднее значение по миру", "предельная величина, выход за которую ведёт к деструктивным процессам", "плановый показатель бюджета", "ставка налога"], "correct": 1, "explain": "Пороговое значение — предельная величина индикатора, несоблюдение которой ведёт к формированию угроз и деструктивным тенденциям."}, "flash": "Критерии ЭБ — признаки оценки состояния экономики. Индикаторы — измеримые показатели, сигнализирующие об угрозах (объём и темп роста ВВП, доля инвестиций в ВВП, уровень инфляции, государственный долг, доля импорта в потреблении, децильный коэффициент, уровень безработицы, доля теневой экономики). Пороговые значения — предельные величины, выход за которые ведёт к деструктивным процессам. Сопоставление фактических индикаторов с пороговыми — основной метод оценки уровня ЭБ."}, {"id": 34, "text": "Методы оценки ЭБ государства. Пороговые значения уровня ЭБ.", "topic": "ЭБ государства", "quiz": {"q": "Основной метод оценки уровня ЭБ государства — это:", "options": ["опрос населения", "инвентаризация", "сравнение фактических индикаторов с пороговыми значениями", "аудиторская проверка"], "correct": 2, "explain": "Базовый метод — индикативный анализ: сопоставление фактических значений индикаторов с пороговыми."}, "flash": "Методы оценки ЭБ государства: индикативный (сопоставление индикаторов с пороговыми значениями — основной); экспертный; балльно-рейтинговый; методы интегральной оценки (сведение показателей в единый индекс); сравнительный (с другими странами и периодами). Пороговые значения позволяют отнести состояние к нормальному, предкризисному или кризисному. Анализ динамики индикаторов даёт раннее предупреждение угроз и служит основой государственной политики обеспечения ЭБ."}, {"id": 35, "text": "Понятие «экономическая безопасность региона». Типологизация регионов.", "topic": "ЭБ региона", "quiz": {"q": "Экономическая безопасность региона — это:", "options": ["объём регионального бюджета", "количество предприятий в регионе", "защищённость экономики региона от угроз при способности к устойчивому развитию", "численность населения"], "correct": 2, "explain": "ЭБ региона — состояние защищённости экономики субъекта РФ от угроз, обеспечивающее устойчивое развитие и достойный уровень жизни."}, "flash": "Экономическая безопасность региона — состояние защищённости экономики субъекта РФ от внутренних и внешних угроз, обеспечивающее устойчивое развитие, целостность экономического пространства и достойный уровень жизни населения. Типологизация регионов: по уровню развития (развитые, депрессивные, кризисные), по специализации (промышленные, аграрные, сырьевые), по бюджетной обеспеченности (доноры и реципиенты), по геополитическому положению (приграничные). Тип региона определяет специфику его угроз и мер защиты."}, {"id": 36, "text": "Угрозы экономической безопасности региона.", "topic": "ЭБ региона", "quiz": {"q": "Что относится к ВНУТРЕННИМ угрозам ЭБ региона?", "options": ["спад производства, безработица, дефицит бюджета, бедность", "санкции других государств", "курс мировых валют", "мировые цены на сырьё"], "correct": 0, "explain": "Внутренние угрозы региона: спад производства, безработица, дотационность, бедность, износ инфраструктуры, отток кадров."}, "flash": "Угрозы ЭБ региона делятся на внутренние (спад производства, высокая безработица, дотационность и дефицит бюджета, бедность и социальное расслоение, износ инфраструктуры, отток квалифицированных кадров, теневая экономика, монопрофильность) и внешние (зависимость от федерального центра, межрегиональная конкуренция, мировая конъюнктура, санкции). Особую опасность представляют депрессивность, разрыв хозяйственных связей и криминализация экономики региона."}, {"id": 37, "text": "Выявление кризисных ситуаций региона. Пороговые значения индикаторов ЭБ региона.", "topic": "ЭБ региона", "quiz": {"q": "Кризисная ситуация в регионе выявляется при:", "options": ["выходе индикаторов за пороговые значения", "любом снижении показателя", "росте населения", "увеличении числа предприятий"], "correct": 0, "explain": "Кризис фиксируется, когда индикаторы ЭБ региона выходят за пороговые значения."}, "flash": "Выявление кризисных ситуаций ведётся через мониторинг индикаторов ЭБ региона и их сопоставление с пороговыми значениями. Индикаторы: ВРП на душу населения, уровень безработицы, доля убыточных предприятий, бюджетная обеспеченность и дефицит, уровень бедности, инвестиции в основной капитал, миграционный отток. Выход за пороги сигнализирует о предкризисном или кризисном состоянии. Раннее выявление позволяет разработать сценарии и мероприятия по нейтрализации угроз и восстановлению устойчивости региона."}, {"id": 38, "text": "ЭБ организации: понятие, функциональные составляющие. Критерии и показатели ЭБ предприятия.", "topic": "ЭБ предприятия", "quiz": {"q": "Экономическая безопасность предприятия — это:", "options": ["размер уставного капитала", "количество сотрудников", "состояние защищённости от угроз и способность к устойчивому развитию", "объём выручки"], "correct": 2, "explain": "ЭБ предприятия — состояние наиболее эффективного использования ресурсов для защиты от угроз и устойчивого функционирования."}, "flash": "Экономическая безопасность предприятия — состояние защищённости его деятельности от внутренних и внешних угроз и наиболее эффективного использования ресурсов для устойчивого функционирования и развития. Функциональные составляющие: финансовая, интеллектуально-кадровая, технико-технологическая, политико-правовая, экологическая, информационная, силовая. Критерии и показатели — финансовая устойчивость, платёжеспособность, рентабельность, доля рынка, защищённость информации, уровень текучести кадров. Цель — минимизация угроз и потерь."}, {"id": 39, "text": "Финансовая составляющая экономической безопасности предприятия.", "topic": "ЭБ предприятия", "quiz": {"q": "Финансовая составляющая ЭБ предприятия оценивается прежде всего через:", "options": ["показатели ликвидности, устойчивости, рентабельности", "численность охраны", "площадь помещений", "количество патентов"], "correct": 0, "explain": "Финансовая составляющая оценивается коэффициентами ликвидности, финансовой устойчивости, платёжеспособности и рентабельности."}, "flash": "Финансовая составляющая — ключевая составляющая ЭБ предприятия, отражающая состояние финансов и эффективность их использования. Оценивается через ликвидность, платёжеспособность, финансовую устойчивость, деловую активность и рентабельность. Угрозы: дефицит оборотных средств, рост дебиторской/кредиторской задолженности, потеря платёжеспособности, кассовые разрывы, финансовое мошенничество, риск банкротства. Обеспечение: финансовое планирование, бюджетирование, внутренний контроль, управление рисками и диагностика банкротства."}, {"id": 40, "text": "Интеллектуальная и кадровая составляющая ЭБ предприятия.", "topic": "ЭБ предприятия", "quiz": {"q": "Кадровая составляющая ЭБ направлена на защиту от угроз, связанных с:", "options": ["экологией", "персоналом (текучесть, недобросовестность, утечка кадров и информации)", "колебанием валют", "износом оборудования"], "correct": 1, "explain": "Кадровая составляющая защищает от угроз со стороны персонала: недобросовестность, текучесть, утечка информации, конфликт интересов."}, "flash": "Интеллектуальная и кадровая составляющая ЭБ обеспечивает защиту и развитие интеллектуального капитала и человеческих ресурсов. Интеллектуальная часть — защита объектов интеллектуальной собственности, ноу-хау, коммерческой тайны. Кадровая часть — защита от угроз, связанных с персоналом: недобросовестность, хищения, разглашение тайны, текучесть, переманивание конкурентами, конфликт интересов. Меры: проверка при приёме, режим коммерческой тайны, мотивация, обучение, контроль лояльности."}, {"id": 41, "text": "Технико-технологическая, политико-правовая, экологическая, информационная и силовая составляющие ЭБ.", "topic": "ЭБ предприятия", "quiz": {"q": "Силовая составляющая ЭБ предприятия обеспечивает:", "options": ["маркетинг", "физическую защиту персонала, имущества и информации", "уплату налогов", "ведение бухучёта"], "correct": 1, "explain": "Силовая составляющая — физическая безопасность персонала, охрана имущества и территории, защита от противоправных посягательств."}, "flash": "Функциональные составляющие ЭБ помимо финансовой и кадровой включают: технико-технологическую (состояние и обновление техники и технологий, защита от технологического отставания); политико-правовую (соответствие законодательству, юридическая защита, лоббирование интересов); экологическую (соблюдение экологических норм, минимизация штрафов и санкций); информационную (защита данных и коммерческой тайны); силовую (физическая защита персонала, имущества и территории, охрана, противодействие посягательствам). Каждая составляющая имеет свои угрозы и индикаторы."}, {"id": 42, "text": "Организация и структура службы экономической безопасности. Функции СЭБ.", "topic": "ЭБ предприятия", "quiz": {"q": "Служба экономической безопасности предприятия — это:", "options": ["аудиторская фирма", "структурное подразделение для защиты от угроз ЭБ", "налоговый орган", "орган статистики"], "correct": 1, "explain": "СЭБ — структурное подразделение предприятия, обеспечивающее защиту его интересов от внутренних и внешних угроз."}, "flash": "Служба экономической безопасности (СЭБ) — подразделение, обеспечивающее защиту предприятия от угроз. Структура зависит от масштаба: отделы режима и охраны, информационной безопасности, экономического анализа и проверки контрагентов, кадровой безопасности, конкурентной разведки, расследований. Функции: выявление и предупреждение угроз, проверка контрагентов и персонала, защита коммерческой тайны, противодействие мошенничеству, расследование инцидентов, взаимодействие с правоохранителями. СЭБ работает в правовом поле и опирается на внутренние регламенты."}, {"id": 43, "text": "Внутренний контроль в системе обеспечения ЭБ предприятия.", "topic": "ЭБ предприятия", "quiz": {"q": "Внутренний контроль в системе ЭБ предприятия — это:", "options": ["банковская проверка", "процесс, обеспечивающий достоверность учёта, сохранность активов и соблюдение регламентов", "внешний аудит", "проверка налоговыми органами"], "correct": 1, "explain": "Внутренний контроль — система мер для обеспечения достоверности учёта, сохранности активов, эффективности операций и соблюдения требований."}, "flash": "Внутренний контроль — процесс, организуемый руководством для обеспечения достаточной уверенности в достижении целей: достоверности отчётности, сохранности активов, эффективности деятельности, соблюдения законодательства и внутренних регламентов. Элементы (по модели COSO): контрольная среда, оценка рисков, контрольные процедуры, информация и коммуникация, мониторинг. Обязанность организовать внутренний контроль закреплена ст. 19 ФЗ № 402-ФЗ. Это базовый инструмент противодействия мошенничеству и обеспечения ЭБ."}, {"id": 44, "text": "Конкурентная разведка. Определение, правовое регулирование, методы и задачи.", "topic": "ЭБ предприятия", "quiz": {"q": "Конкурентная разведка — это:", "options": ["кража документов", "промышленный шпионаж", "подкуп чиновников", "законный сбор и анализ открытой информации о конкурентной среде"], "correct": 3, "explain": "Конкурентная разведка — легальный сбор и аналитическая обработка открытой информации для принятия управленческих решений."}, "flash": "Конкурентная (деловая) разведка — постоянный легальный сбор и аналитическая обработка информации о конкурентной среде из открытых источников для поддержки управленческих решений. В отличие от промышленного шпионажа использует только законные методы. Регулируется в рамках законодательства о коммерческой тайне, защите конкуренции и персональных данных. Задачи: оценка конкурентов, выявление рыночных возможностей и угроз, проверка контрагентов. Цикл разведки: планирование → сбор → обработка и анализ → доведение результатов до пользователя."}, {"id": 45, "text": "Противодействие рейдерским захватам. Сделки корпоративного контроля. Защита от недружественного поглощения.", "topic": "ЭБ предприятия", "quiz": {"q": "Защита от недружественного (рейдерского) поглощения предполагает прежде всего:", "options": ["добровольную передачу активов", "юридические и организационные меры защиты корпоративного контроля", "отказ от регистрации прав", "ликвидацию общества"], "correct": 1, "explain": "Рейдерство — установление контроля над активами вопреки воле собственника. Защита: контроль реестра акционеров, защита от размытия долей, юридическая чистота владения."}, "flash": "Противодействие рейдерским захватам. Рейдерство — незаконное или недобросовестное установление контроля над активами и бизнесом вопреки воле собственника, нередко через сделки корпоративного контроля (скупка акций/долей, смена менеджмента, манипуляции с реестром, фальсификация документов, использование судебных и административных рычагов). Недружественное поглощение — приобретение контроля против воли действующих владельцев. Защита: концентрация и контроль пакета акций, защита реестра у независимого регистратора, «противоакульи» положения в уставе, мониторинг сделок с долями, юридическая чистота титула на активы, работа службы ЭБ. Уголовно наказуемы фальсификация ЕГРЮЛ (ст. 170.1 УК РФ), рейдерские захваты (ст. 159, 179 УК РФ)."}, {"id": 46, "text": "Экономическая безопасность личности: понятие, опасности и угрозы.", "topic": "ЭБ государства", "quiz": {"q": "Экономическая безопасность личности — это:", "options": ["размер заработной платы", "защищённость материальных интересов человека и его способности к достойной жизни", "трудовой стаж", "наличие банковской карты"], "correct": 1, "explain": "ЭБ личности — состояние защищённости экономических интересов человека, обеспечивающее достойный уровень и качество жизни."}, "flash": "Экономическая безопасность личности — состояние защищённости экономических интересов человека, при котором обеспечиваются достойный уровень и качество жизни, реализация трудовых и имущественных прав. Опасности и угрозы: безработица, бедность, инфляция, потеря сбережений, финансовое мошенничество, закредитованность, отсутствие социальных гарантий. Система оценки опирается на показатели доходов, прожиточного минимума, дифференциации (децильный коэффициент), уровня бедности и социальной защищённости."}, {"id": 47, "text": "Теневая экономика: незаконные отношения, методы измерения, противодействие.", "topic": "ЭБ государства", "quiz": {"q": "Теневая экономика — это:", "options": ["государственный сектор", "легальный малый бизнес", "биржевая торговля", "совокупность экономических отношений, скрываемых от учёта и контроля государства"], "correct": 3, "explain": "Теневая экономика — скрытая от учёта, налогообложения и контроля государства экономическая деятельность."}, "flash": "Теневая экономика — совокупность экономических отношений, скрываемых от государственного учёта, налогообложения и контроля. Структура: скрытая (легальная деятельность с занижением), неформальная (без регистрации), нелегальная (криминальная). Методы измерения: прямые (опросы, проверки) и косвенные (монетарный метод, метод расхождений, метод физических затрат — электропотребление, метод Гутмана). Криминализация подрывает ЭБ. Противодействие: совершенствование законодательства, налоговый контроль, ПОД/ФТ, цифровизация расчётов, снижение административных барьеров."}, {"id": 48, "text": "Коррупция: сущность и классификация. Коррупция в системе угроз ЭБ. Механизм противодействия.", "topic": "ЭБ государства", "quiz": {"q": "Коррупция по ФЗ № 273-ФЗ — это:", "options": ["налоговая ошибка", "злоупотребление служебным положением, дача/получение взятки в целях выгоды", "задержка зарплаты", "любое нарушение трудовой дисциплины"], "correct": 1, "explain": "ФЗ № 273-ФЗ: коррупция — злоупотребление полномочиями, взяточничество и иное незаконное использование положения ради выгоды."}, "flash": "Коррупция (ФЗ от 25.12.2008 № 273-ФЗ) — злоупотребление служебным положением, дача и получение взятки, коммерческий подкуп, иное незаконное использование положения вопреки законным интересам ради выгоды. Виды: деловая и бытовая, верхушечная и низовая, политическая. Как угроза ЭБ коррупция искажает конкуренцию, снижает инвестиции, питает теневую экономику. Механизм противодействия: профилактика, декларирование доходов, урегулирование конфликта интересов, антикоррупционная экспертиза НПА, ответственность (ст. 290–291.2 УК РФ)."}, {"id": 49, "text": "Финансовая безопасность РФ: сущность, угрозы, пороговые значения.", "topic": "ЭБ государства", "quiz": {"q": "Финансовая безопасность РФ — это:", "options": ["состояние защищённости финансовой системы от угроз, обеспечивающее её устойчивость", "количество банков", "размер золотовалютных резервов", "объём наличных денег"], "correct": 0, "explain": "Финансовая безопасность — защищённость финансовой системы государства от угроз при сохранении устойчивости и развития."}, "flash": "Финансовая безопасность РФ — состояние защищённости финансовой системы (бюджетной, налоговой, денежно-кредитной, валютной, банковской) от внутренних и внешних угроз, обеспечивающее её устойчивость и развитие. Угрозы: дефицит бюджета и рост госдолга, инфляция, отток капитала, долларизация, санкции, теневые финансовые потоки, киберугрозы. Пороговые значения: уровень госдолга к ВВП, дефицит бюджета, инфляция, доля иностранной валюты в расчётах, золотовалютные резервы. Обеспечивается денежно-кредитной и бюджетной политикой Банка России и Минфина."}, {"id": 50, "text": "Безопасность денежно-кредитной системы РФ. Противодействие переводу безналичных средств в теневой наличный оборот.", "topic": "ЭБ государства", "quiz": {"q": "Противодействие переводу безналичных средств в теневой наличный оборот (обналичиванию) ведётся прежде всего в рамках:", "options": ["экологического контроля", "налогового планирования", "законодательства о ПОД/ФТ (№ 115-ФЗ) и банковского надзора", "трудового законодательства"], "correct": 2, "explain": "Противодействие обналичиванию ведётся в рамках ФЗ № 115-ФЗ (ПОД/ФТ) и надзора Банка России и Росфинмониторинга."}, "flash": "Безопасность денежно-кредитной системы — защищённость денежного обращения и кредитной сферы от угроз: инфляции, фальшивомонетничества, обналичивания, вывода капитала, киберугроз. Устойчивость национальной финансовой системы — приоритет денежно-кредитной политики. Противодействие переводу безналичных средств в теневой наличный оборот (обналичиванию) ведётся в рамках ФЗ № 115-ФЗ о ПОД/ФТ, банковского надзора Банка России и работы Росфинмониторинга: контроль подозрительных операций, блокировка сомнительных счетов, идентификация клиентов."}, {"id": 51, "text": "Иностранные инвестиции и национальные интересы РФ.", "topic": "ЭБ государства", "quiz": {"q": "Иностранные инвестиции в стратегические отрасли РФ:", "options": ["ограничены и контролируются специальным законом (№ 57-ФЗ)", "не регулируются", "поощряются без ограничений", "полностью запрещены"], "correct": 0, "explain": "Доступ иностранных инвесторов к стратегическим отраслям ограничен ФЗ № 57-ФЗ в интересах национальной безопасности."}, "flash": "Иностранные инвестиции привлекают капитал, технологии и рабочие места, но несут риски для национальных интересов: утрата контроля над стратегическими активами, технологическая и сырьевая зависимость, отток прибыли. Поэтому их доступ к стратегическим отраслям ограничен ФЗ от 29.04.2008 № 57-ФЗ (требуется согласование сделок правительственной комиссией). Баланс между привлечением инвестиций и защитой суверенитета — задача обеспечения ЭБ. Гарантии иностранным инвесторам даёт ФЗ № 160-ФЗ."}, {"id": 52, "text": "Безопасность внешнеэкономической деятельности РФ: понятие, угрозы, пороговые значения.", "topic": "ЭБ государства", "quiz": {"q": "Безопасность внешнеэкономической деятельности (ВЭД) РФ связана прежде всего с противодействием:", "options": ["развитию туризма", "контрабанде, уклонению от пошлин, незаконному вывозу капитала", "росту зарплат", "внутренней миграции"], "correct": 1, "explain": "Угрозы ВЭД: контрабанда, занижение таможенной стоимости, невозврат валютной выручки, незаконный вывоз капитала."}, "flash": "Безопасность ВЭД — защищённость внешнеэкономических интересов государства от угроз. Угрозы: контрабанда (ст. 200.1, 200.2, 226.1, 229.1 УК РФ), уклонение от таможенных платежей, занижение таможенной стоимости, невозврат валютной выручки, незаконный вывоз капитала, недобросовестная конкуренция. Пороговые значения: сальдо торгового баланса, доля экспорта/импорта, товарная структура. Обеспечивается таможенным и валютным контролем (ФТС, Банк России), регулируется ТК ЕАЭС и ФЗ № 173-ФЗ о валютном регулировании."}, {"id": 53, "text": "Бухгалтерский учёт: его место в системе управления экономикой организации.", "topic": "Бухучёт", "quiz": {"q": "Бухгалтерский учёт регулируется в РФ прежде всего:", "options": ["ФЗ № 402-ФЗ «О бухгалтерском учёте» и ФСБУ", "Законом о рекламе", "Трудовым кодексом", "Уголовным кодексом"], "correct": 0, "explain": "Базовый акт — ФЗ от 06.12.2011 № 402-ФЗ «О бухгалтерском учёте»; правила — федеральные стандарты (ФСБУ)."}, "flash": "Бухгалтерский учёт — формирование документированной систематизированной информации об объектах учёта и составление на её основе отчётности (ФЗ № 402-ФЗ). Место в управлении: учёт — основная информационная система предприятия, поставщик данных для анализа, контроля и принятия решений. Функции: информационная, контрольная, аналитическая, обеспечения сохранности имущества. Объекты: факты хозяйственной жизни, активы, обязательства, источники, доходы, расходы. Регулирование: ФЗ № 402-ФЗ, ФСБУ, отраслевые стандарты, учётная политика организации."}, {"id": 54, "text": "Учёт собственного капитала.", "topic": "Бухучёт", "quiz": {"q": "Собственный капитал организации НЕ включает:", "options": ["уставный капитал", "кредиты банка", "нераспределённую прибыль", "добавочный и резервный капитал"], "correct": 1, "explain": "Кредиты банка — это заёмный капитал (обязательства), а не собственный. Собственный капитал — уставный, добавочный, резервный, нераспределённая прибыль."}, "flash": "Учёт собственного капитала ведётся на счетах раздела VII Плана счетов: 80 «Уставный капитал», 82 «Резервный капитал», 83 «Добавочный капитал», 84 «Нераспределённая прибыль (непокрытый убыток)», 81 «Собственные акции (доли)». Собственный капитал = чистые активы; отражает вложения собственников и накопленную прибыль. Его величина и динамика — индикатор финансовой устойчивости и ЭБ: рост собственного капитала укрепляет независимость, отрицательные чистые активы — признак угрозы банкротства."}, {"id": 55, "text": "Учёт долгосрочных инвестиций.", "topic": "Бухучёт", "quiz": {"q": "Долгосрочные инвестиции (вложения во внеоборотные активы) учитываются на счёте:", "options": ["08 «Вложения во внеоборотные активы»", "70 «Расчёты с персоналом»", "90 «Продажи»", "50 «Касса»"], "correct": 0, "explain": "Затраты на создание/приобретение внеоборотных активов аккумулируются на счёте 08 до ввода объекта в эксплуатацию."}, "flash": "Учёт долгосрочных инвестиций — это учёт капитальных вложений в создание и приобретение внеоборотных активов (строительство, покупка ОС, НМА). Затраты аккумулируются на счёте 08 «Вложения во внеоборотные активы», после ввода объекта в эксплуатацию списываются на счета 01 «Основные средства» или 04 «Нематериальные активы» по первоначальной стоимости. Регулируется ФСБУ 26/2020 «Капитальные вложения». Контроль за обоснованностью инвестиций — элемент внутреннего контроля и ЭБ."}, {"id": 56, "text": "Учёт основных средств.", "topic": "Бухучёт", "quiz": {"q": "Основные средства учитываются на счёте:", "options": ["60 «Расчёты с поставщиками»", "01 «Основные средства»", "41 «Товары»", "10 «Материалы»"], "correct": 1, "explain": "ОС отражаются на счёте 01, амортизация — на счёте 02. Учёт регулирует ФСБУ 6/2020."}, "flash": "Учёт основных средств регулируется ФСБУ 6/2020 и ФСБУ 26/2020. ОС принимаются к учёту по первоначальной стоимости на счёте 01, амортизация начисляется на счёте 02. Способы амортизации: линейный, уменьшаемого остатка, пропорционально продукции. Элементы амортизации (срок полезного использования, ликвидационная стоимость) ежегодно проверяются. Возможна переоценка. Аналитический учёт — по объектам (инвентарные карточки). Контроль наличия и состояния ОС (инвентаризация) — важная функция обеспечения сохранности активов и ЭБ."}, {"id": 57, "text": "Учёт нематериальных активов.", "topic": "Бухучёт", "quiz": {"q": "Нематериальные активы — это объекты, которые:", "options": ["имеют материально-вещественную форму", "всегда являются товаром", "не имеют материальной формы, используются свыше 12 мес. и приносят выгоды", "являются денежными средствами"], "correct": 2, "explain": "НМА — идентифицируемые объекты без материальной формы, используемые свыше 12 месяцев и способные приносить выгоды (ФСБУ 14/2022)."}, "flash": "Нематериальные активы (ФСБУ 14/2022) — идентифицируемые объекты без материально-вещественной формы, используемые свыше 12 месяцев и способные приносить экономические выгоды: исключительные права на изобретения, программы, товарные знаки, ноу-хау. Учитываются на счёте 04 по первоначальной стоимости, амортизация — на счёте 05. Защита НМА (интеллектуальной собственности) — задача интеллектуальной составляющей ЭБ предприятия; их незаконное использование наносит прямой ущерб."}, {"id": 58, "text": "Учёт материально-производственных запасов.", "topic": "Бухучёт", "quiz": {"q": "Материально-производственные запасы учитываются на счёте:", "options": ["10 «Материалы»", "01 «Основные средства»", "80 «Уставный капитал»", "99 «Прибыли и убытки»"], "correct": 0, "explain": "Запасы (материалы) учитываются на счёте 10 по ФСБУ 5/2019; готовая продукция — на счёте 43."}, "flash": "Учёт запасов регулируется ФСБУ 5/2019. Запасы — активы, потребляемые в одном цикле или предназначенные для продажи: сырьё, материалы (счёт 10), товары (41), готовая продукция (43). Принимаются по фактической себестоимости. Методы списания: по себестоимости каждой единицы, по средней себестоимости, ФИФО. Регулярная инвентаризация запасов обеспечивает сохранность активов и выявляет недостачи и хищения — важнейший участок внутреннего контроля и ЭБ предприятия."}, {"id": 59, "text": "Учёт труда и его оплаты.", "topic": "Бухучёт", "quiz": {"q": "Расчёты по оплате труда учитываются на счёте:", "options": ["50 «Касса»", "68 «Расчёты по налогам»", "01 «Основные средства»", "70 «Расчёты с персоналом по оплате труда»"], "correct": 3, "explain": "Начисление и выплата зарплаты отражаются на счёте 70; удержания НДФЛ — на счёте 68, страховые взносы — на 69."}, "flash": "Учёт труда и его оплаты ведётся на счёте 70 «Расчёты с персоналом по оплате труда». Начисление зарплаты относится на счета затрат (20, 25, 26, 44), удержания НДФЛ — на счёт 68, страховые взносы — на счёт 69. Формы оплаты: повременная и сдельная. Регулируется ТК РФ и НК РФ. Этот участок — зона риска: фиктивные («мёртвые души»), завышенные начисления, серые зарплаты. Контроль расчётов по оплате труда — элемент кадровой и финансовой безопасности."}, {"id": 60, "text": "Учёт расходов.", "topic": "Бухучёт", "quiz": {"q": "Расходы по обычным видам деятельности собираются на счетах:", "options": ["50, 51 (денежные)", "90, 91 (результаты)", "80, 82, 83 (капитал)", "20, 25, 26, 44 (затратные)"], "correct": 3, "explain": "Затраты аккумулируются на счетах 20 «Основное производство», 25, 26, 44 и др."}, "flash": "Учёт расходов (ПБУ 10/99) ведётся на затратных счетах: 20 «Основное производство», 23 «Вспомогательные производства», 25 «Общепроизводственные расходы», 26 «Общехозяйственные расходы», 44 «Расходы на продажу». Расходы группируются по элементам и статьям, формируют себестоимость продукции, которая списывается в дебет счёта 90 «Продажи». Обоснованность и документальная подтверждённость расходов — ключевой объект контроля: фиктивные расходы используются для вывода средств и уклонения от налогов."}, {"id": 61, "text": "Учёт готовой продукции.", "topic": "Бухучёт", "quiz": {"q": "Готовая продукция учитывается на счёте:", "options": ["04 «НМА»", "43 «Готовая продукция»", "41 «Товары»", "10 «Материалы»"], "correct": 1, "explain": "Готовая продукция собственного производства — счёт 43; покупные товары — счёт 41."}, "flash": "Учёт готовой продукции ведётся на счёте 43 «Готовая продукция» по фактической или нормативной (плановой) себестоимости. При реализации себестоимость списывается в дебет счёта 90 «Продажи». Готовая продукция — часть запасов (ФСБУ 5/2019). Контроль её наличия, движения и сохранности на складе через инвентаризацию предотвращает хищения и пересортицу — участок внутреннего контроля и обеспечения сохранности активов предприятия."}, {"id": 62, "text": "Учёт денежных средств.", "topic": "Бухучёт", "quiz": {"q": "Денежные средства в кассе и на расчётном счёте учитываются на счетах:", "options": ["01 и 02", "70 и 68", "80 и 84", "50 и 51"], "correct": 3, "explain": "Касса — счёт 50, расчётный счёт — счёт 51; валютные счета — 52."}, "flash": "Учёт денежных средств: счёт 50 «Касса», 51 «Расчётные счета», 52 «Валютные счета», 55 «Специальные счета», 57 «Переводы в пути». Кассовые операции регулируются указаниями Банка России (лимит остатка кассы, кассовая дисциплина). Денежные средства — наиболее ликвидный и наиболее уязвимый для злоупотреблений актив, поэтому требуют усиленного контроля: инвентаризация кассы, разделение полномочий, сверка с банком. Это ключевой участок финансовой безопасности."}, {"id": 63, "text": "Учёт финансовых вложений.", "topic": "Бухучёт", "quiz": {"q": "Финансовые вложения — это:", "options": ["выплата зарплаты", "покупка материалов", "приобретение основных средств", "инвестиции в ценные бумаги, вклады, предоставленные займы (счёт 58)"], "correct": 3, "explain": "Финансовые вложения (ПБУ 19/02) — ценные бумаги, вклады в УК других организаций, предоставленные займы; счёт 58."}, "flash": "Учёт финансовых вложений регулируется ПБУ 19/02. К ним относятся: ценные бумаги (акции, облигации), вклады в уставные капиталы других организаций, предоставленные займы, депозиты, дебиторская задолженность по уступке прав. Учитываются на счёте 58 «Финансовые вложения» по первоначальной стоимости. По вложениям с рыночной котировкой возможна переоценка; по остальным — проверка на обесценение. Контроль обоснованности финансовых вложений предотвращает вывод активов через фиктивные сделки."}, {"id": 64, "text": "Учёт финансовых результатов.", "topic": "Бухучёт", "quiz": {"q": "Финансовый результат деятельности формируется на счетах:", "options": ["10 и 20", "80 и 83", "90 «Продажи» и 91 «Прочие доходы и расходы», итог — на 99", "50 и 51"], "correct": 2, "explain": "Результат от продаж — на счёте 90, прочие — на 91; итоговый финансовый результат — на счёте 99, чистая прибыль — на 84."}, "flash": "Учёт финансовых результатов: счёт 90 «Продажи» (результат от обычной деятельности), 91 «Прочие доходы и расходы», 99 «Прибыли и убытки» (итоговый результат). По окончании года счёт 99 закрывается на счёт 84 «Нераспределённая прибыль (непокрытый убыток)» — реформация баланса. Финансовый результат = доходы минус расходы. Манипуляции с признанием доходов и расходов искажают прибыль и являются типичным видом искажения отчётности, выявляемого при аудите и контроле."}, {"id": 65, "text": "Бухгалтерская отчётность предприятия.", "topic": "Бухучёт", "quiz": {"q": "Бухгалтерская (финансовая) отчётность включает прежде всего:", "options": ["только налоговую декларацию", "бухгалтерский баланс и отчёт о финансовых результатах", "только штатное расписание", "только кассовую книгу"], "correct": 1, "explain": "Основные формы — бухгалтерский баланс и отчёт о финансовых результатах с приложениями (ФЗ № 402-ФЗ)."}, "flash": "Бухгалтерская (финансовая) отчётность — единая система данных об имущественном и финансовом положении организации (ФЗ № 402-ФЗ). Состав: бухгалтерский баланс, отчёт о финансовых результатах, приложения (отчёт об изменениях капитала, о движении денежных средств, пояснения). Требования: достоверность, полнота, существенность, сопоставимость. Сдаётся в ГИРБО (ФНС). Отчётность — главный информационный источник для анализа ЭБ; её искажение (вуалирование, фальсификация) — серьёзная угроза и состав правонарушения."}, {"id": 66, "text": "Учётная политика организации.", "topic": "Бухучёт", "quiz": {"q": "Учётная политика организации — это:", "options": ["устав организации", "приказ о приёме на работу", "налоговая декларация", "совокупность выбранных способов ведения бухгалтерского учёта"], "correct": 3, "explain": "Учётная политика (ПБУ 1/2008) — совокупность принятых организацией способов ведения бухгалтерского учёта."}, "flash": "Учётная политика (ПБУ 1/2008) — совокупность выбранных организацией способов ведения бухгалтерского учёта (первичное наблюдение, стоимостное измерение, группировка, обобщение). Формируется главным бухгалтером, утверждается руководителем, применяется последовательно. Включает: рабочий план счетов, формы первичных документов, методы амортизации и оценки запасов, порядок инвентаризации, организацию внутреннего контроля. Допущения: имущественной обособленности, непрерывности, последовательности, временной определённости фактов. Это инструмент и законной налоговой оптимизации, и зона риска злоупотреблений."}, {"id": 67, "text": "Уголовное законодательство РФ. Уголовная ответственность и её основания.", "topic": "Уголовное право", "quiz": {"q": "Единственным источником уголовного права в РФ является:", "options": ["постановление Правительства", "Уголовный кодекс РФ", "любой федеральный закон", "указ министерства"], "correct": 1, "explain": "Уголовное законодательство РФ состоит исключительно из Уголовного кодекса РФ (ст. 1 УК РФ)."}, "flash": "Уголовное законодательство РФ состоит исключительно из УК РФ (ст. 1); новые законы об ответственности включаются в него. Основание уголовной ответственности (ст. 8 УК РФ) — совершение деяния, содержащего все признаки состава преступления. Принципы: законность, равенство перед законом, вина, справедливость, гуманизм. УК РФ основан на Конституции и общепризнанных принципах международного права. Для ЭБ значимы главы 21 (против собственности), 22 (в сфере экономической деятельности), 23 (против интересов службы в коммерческих организациях)."}, {"id": 68, "text": "Понятие преступления по уголовному праву РФ. Состав преступления.", "topic": "Уголовное право", "quiz": {"q": "Состав преступления включает четыре элемента:", "options": ["истец, ответчик, суд, прокурор", "мотив, повод, орудие, место", "объект, объективная сторона, субъект, субъективная сторона", "доход, расход, прибыль, убыток"], "correct": 2, "explain": "Состав преступления: объект, объективная сторона, субъект, субъективная сторона."}, "flash": "Преступление (ст. 14 УК РФ) — виновно совершённое общественно опасное деяние, запрещённое УК под угрозой наказания. Признаки: общественная опасность, противоправность, виновность, наказуемость. Состав преступления — совокупность признаков, образующих четыре элемента: объект (охраняемые отношения), объективная сторона (деяние, последствия, причинная связь), субъект (вменяемое физлицо с определённого возраста), субъективная сторона (вина в форме умысла или неосторожности, мотив, цель). Отсутствие любого элемента исключает уголовную ответственность."}, {"id": 69, "text": "Основополагающие идеи уголовной политики в обеспечении ЭБ.", "topic": "Уголовное право", "quiz": {"q": "Уголовная политика в сфере ЭБ направлена прежде всего на:", "options": ["снижение налогов", "предупреждение и противодействие экономическим преступлениям", "отмену наказаний", "увеличение числа осуждённых"], "correct": 1, "explain": "Цель уголовной политики в сфере ЭБ — предупреждение, выявление и противодействие преступлениям, угрожающим экономике."}, "flash": "Уголовная политика — направление государственной политики по противодействию преступности средствами уголовного права. Основополагающие идеи в сфере ЭБ: приоритет предупреждения над наказанием, дифференциация и индивидуализация ответственности, экономия репрессии (декриминализация и гуманизация в отношении предпринимателей), неотвратимость ответственности за тяжкие экономические преступления. Реализуется через криминализацию опасных деяний (гл. 22 УК РФ), профилактику и взаимодействие правоохранительных органов."}, {"id": 70, "text": "Предупреждение административных правонарушений в сфере экономической деятельности.", "topic": "Уголовное право", "quiz": {"q": "Административные правонарушения в сфере экономики регулируются:", "options": ["Уголовным кодексом", "Трудовым кодексом", "Кодексом РФ об административных правонарушениях (КоАП)", "Гражданским кодексом"], "correct": 2, "explain": "Административная ответственность за экономические проступки установлена КоАП РФ."}, "flash": "Предупреждение административных правонарушений в сфере экономики опирается на КоАП РФ (нарушения в области финансов, налогов, предпринимательства, таможенного дела, защиты конкуренции). Меры предупреждения: правовое регулирование, контрольно-надзорная деятельность, профилактические проверки, информирование. Административные правонарушения часто предшествуют преступлениям, поэтому их пресечение — важный элемент профилактики экономической преступности и обеспечения ЭБ. Ответственность: предупреждение, штраф, дисквалификация, приостановление деятельности."}, {"id": 71, "text": "Характеристика профилактики экономических преступлений органами внутренних дел.", "topic": "Уголовное право", "quiz": {"q": "Профилактику экономических преступлений органы внутренних дел осуществляют через:", "options": ["выявление и устранение причин и условий преступлений, оперативно-профилактические меры", "только наказание виновных", "установление налогов", "выдачу лицензий"], "correct": 0, "explain": "ОВД ведут профилактику: выявляют и устраняют причины и условия преступлений, проводят оперативно-розыскные и профилактиче
