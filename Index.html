const TOPICS = [...new Set(Q.map(q=>q.topic))];
const quizPool = Q.filter(q=>q.quiz);
const flashPool = Q.filter(q=>q.flash);
 
// persistent-ish progress (in-memory; resets on full reload — storage APIs not allowed in artifacts)
const progress = { quiz:{}, cards:{} };
 
let activeTab='browse', activeTopic='Все', searchTerm='';
 
const main = document.getElementById('main');
const searchwrap = document.getElementById('searchwrap');
const searchInput = document.getElementById('search');
const sclear = document.getElementById('sclear');
 
document.querySelectorAll('.tab').forEach(t=>{
 t.onclick=()=>{ activeTab=t.dataset.tab;
   document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
   render(); };
});
searchInput.addEventListener('input',e=>{ searchTerm=e.target.value.trim();
 sclear.classList.toggle('show', searchTerm.length>0); renderBrowse(); });
sclear.onclick=()=>{ searchTerm=''; searchInput.value=''; sclear.classList.remove('show'); renderBrowse(); };
 
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function highlight(text,term){
 if(!term) return esc(text);
 const t=esc(text); const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
 return t.replace(re,'<mark>$1</mark>');
}
 
function render(){
 if(activeTab==='browse'){ searchwrap.style.display='block'; renderBrowse(); }
 else { searchwrap.style.display='none'; }
 if(activeTab==='quiz') renderQuizHome();
 if(activeTab==='cards') renderCardsHome();
 if(activeTab==='stats') renderStats();
}
 
/* ---------------- BROWSE ---------------- */
function renderBrowse(){
 let html='<div class="chips">';
 html+=`<div class="chip ${activeTopic==='Все'?'active':''}" data-topic="Все">Все · ${Q.length}</div>`;
 TOPICS.forEach(t=>{ const n=Q.filter(q=>q.topic===t).length;
   html+=`<div class="chip ${activeTopic===t?'active':''}" data-topic="${esc(t)}">${esc(t)} · ${n}</div>`; });
 html+='</div>';
 
 let list=Q.filter(q=>activeTopic==='Все'||q.topic===activeTopic);
 if(searchTerm){ const term=searchTerm.toLowerCase();
   list=list.filter(q=>q.text.toLowerCase().includes(term)||q.topic.toLowerCase().includes(term)||String(q.id)===term); }
 
 if(!list.length){ html+='<div class="empty">Ничего не найдено.<br>Попробуйте другое слово или номер билета.</div>'; }
 list.forEach(q=>{
   const badge = q.quiz?'<span class="badge test">ТЕСТ + ОТВЕТ</span>'
               : q.flash?'<span class="badge flash">ЕСТЬ ОТВЕТ</span>':'';
   html+=`<div class="qcard" data-id="${q.id}">${badge}
     <div class="num">БИЛЕТ ${q.id} <span class="topic">${esc(q.topic)}</span></div>
     <p class="qtext">${highlight(q.text,searchTerm)}</p></div>`;
 });
 main.innerHTML=html;
 main.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{activeTopic=c.dataset.topic;renderBrowse();});
 main.querySelectorAll('.qcard').forEach(c=>c.onclick=()=>openDetail(+c.dataset.id));
}
 
/* ---------------- DETAIL ---------------- */
function openDetail(id){
 const q=Q.find(x=>x.id===id);
 document.getElementById('d-title').textContent='Билет '+q.id;
 document.getElementById('d-sub').textContent=q.topic;
 let body=`<div class="d-num">БИЛЕТ ${q.id}</div><div class="d-q">${esc(q.text)}</div>`;
 if(q.flash){
   body+=`<div class="d-label">Краткий ответ</div><div class="d-answer">${esc(q.flash)}</div>`;
   if(q.quiz){
     body+=`<button class="btn btn-gold" onclick="closeDetail();startQuiz([${q.id}])">Проверить себя тестом →</button>`;
   }
 } else {
   body+=`<div class="d-soon">Ответ к этому билету скоро появится.</div>`;
 }
 document.getElementById('d-body').innerHTML=body;
 document.getElementById('detail').classList.add('show');
}
function closeDetail(){document.getElementById('detail').classList.remove('show');}
 
/* ---------------- QUIZ ---------------- */
let qz={list:[],i:0,correct:0,answered:false};
function renderQuizHome(){
 const done=Object.keys(progress.quiz).length;
 main.innerHTML=`
   <div class="hero">
     <h3>Тест по билетам</h3>
     <p>Вопросы с вариантами ответа, как в билетах ПДД. После ответа сразу видно, верно ли, и почему — с опорой на источник. Доступны все ${quizPool.length} билетов программы.</p>
     <button class="btn btn-gold go" onclick="startQuiz()">Начать тест · ${quizPool.length} вопросов</button>
     <button class="btn btn-ghost" onclick="startQuiz(null,true)">Перемешать и пройти</button>
   </div>
   <div class="stat-row">
     <div class="stat"><div class="v">${done}</div><div class="k">пройдено</div></div>
     <div class="stat"><div class="v">${Object.values(progress.quiz).filter(x=>x).length}</div><div class="k">верно</div></div>
     <div class="stat"><div class="v">${quizPool.length}</div><div class="k">всего</div></div>
   </div>
   <div class="hero"><h3>Как заниматься</h3>
     <p>Проходите тест целиком или открывайте отдельный билет на вкладке «Билеты» и жмите «Проверить себя тестом». Объяснение под каждым вопросом помогает запомнить формулировку для устного ответа.</p></div>`;
}
function startQuiz(ids=null,shuffle=false){
 let pool = ids ? Q.filter(q=>ids.includes(q.id)&&q.quiz) : quizPool.slice();
 if(shuffle) pool.sort(()=>Math.random()-0.5);
 qz={list:pool,i:0,correct:0,answered:false};
 document.getElementById('quizsheet').classList.add('show');
 drawQuiz();
}
function closeQuiz(){document.getElementById('quizsheet').classList.remove('show');render();}
function drawQuiz(){
 const q=qz.list[qz.i]; const z=q.quiz;
 document.getElementById('qz-sub').textContent=`Вопрос ${qz.i+1} из ${qz.list.length}`;
 const pct=Math.round(qz.i/qz.list.length*100);
 let h=`<div class="progress"><i style="width:${pct}%"></i></div>
   <div class="qz-meta"><span>Билет ${q.id}</span><span>${esc(q.topic)}</span></div>
   <div class="qz-q">${esc(z.q)}</div>`;
 h+='<div id="opts">';
 z.options.forEach((o,idx)=>{ const mk=String.fromCharCode(65+idx);
   h+=`<button class="opt" data-idx="${idx}"><span class="mk">${mk}</span>${esc(o)}</button>`; });
 h+='</div>';
 h+=`<div class="explain" id="exp"><div class="et">Пояснение · опора на источник</div>${esc(z.explain)}</div>`;
 h+=`<button class="btn btn-gold" id="nextbtn" style="display:none" onclick="nextQuiz()">${qz.i+1<qz.list.length?'Следующий вопрос →':'Показать результат'}</button>`;
 document.getElementById('qz-body').innerHTML=h;
 qz.answered=false;
 document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.idx));
}
function answerQuiz(idx){
 if(qz.answered) return; qz.answered=true;
 const q=qz.list[qz.i]; const z=q.quiz; const ok=idx===z.correct;
 if(ok) qz.correct++;
 progress.quiz[q.id]=ok;
 document.querySelectorAll('#opts .opt').forEach(b=>{
   const i=+b.dataset.idx;
   if(i===z.correct) b.classList.add('correct');
   else if(i===idx) b.classList.add('wrong');
   else b.classList.add('dim');
   b.style.pointerEvents='none';
 });
 document.getElementById('exp').classList.add('show');
 document.getElementById('nextbtn').style.display='block';
}
function nextQuiz(){
 if(qz.i+1<qz.list.length){ qz.i++; drawQuiz();
   document.getElementById('qz-body').scrollTop=0; }
 else showQuizResult();
}
function showQuizResult(){
 const total=qz.list.length, c=qz.correct, pct=Math.round(c/total*100);
 let msg = pct>=85?'Отличный результат — вы готовы!' : pct>=60?'Хорошо, но стоит повторить слабые места.' : 'Нужно ещё поработать с этими билетами.';
 const r=251.2, off=r-(r*pct/100);
 document.getElementById('qz-body').innerHTML=`
   <div class="result">
     <svg class="ring" viewBox="0 0 100 100">
       <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
       <circle cx="50" cy="50" r="40" fill="none" stroke="url(#g)" stroke-width="9"
         stroke-linecap="round" stroke-dasharray="${r}" stroke-dashoffset="${off}"
         transform="rotate(-90 50 50)"/>
       <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
         <stop offset="0" stop-color="#f0cd77"/><stop offset="1" stop-color="#e7b84e"/></linearGradient></defs>
     </svg>
     <div class="big">${c}/${total}</div>
     <div class="lbl">правильных ответов · ${pct}%</div>
     <div class="msg">${msg}</div>
     <button class="btn btn-gold" onclick="startQuiz(${JSON.stringify(qz.list.map(q=>q.id))})">Пройти заново</button>
     <button class="btn btn-ghost" onclick="closeQuiz()">Готово</button>
   </div>`;
}
 
/* ---------------- CARDS ---------------- */
let fc={list:[],i:0,known:0};
function renderCardsHome(){
 main.innerHTML=`
   <div class="hero">
     <h3>Карточки для запоминания</h3>
     <p>Видите вопрос — формулируете ответ вслух — переворачиваете карточку и проверяете себя. Затем отмечаете «знал» или «повторить». Доступны все ${flashPool.length} карточек программы.</p>
     <button class="btn btn-gold go" onclick="startCards()">Учить · ${flashPool.length} карточек</button>
     <button class="btn btn-ghost" onclick="startCards(true)">Перемешать</button>
   </div>
   <div class="hero"><h3>Совет</h3>
     <p>Проговаривайте ответ полностью, как на экзамене: определение → классификация → связь с экономической безопасностью. Это тренирует именно устную подачу.</p></div>`;
}
function startCards(shuffle=false){
 let pool=flashPool.slice(); if(shuffle) pool.sort(()=>Math.random()-0.5);
 fc={list:pool,i:0,known:0};
 document.getElementById('cardsheet').classList.add('show');
 drawCard();
}
function closeCards(){document.getElementById('cardsheet').classList.remove('show');render();}
function drawCard(){
 if(fc.i>=fc.list.length){ showCardResult(); return; }
 const q=fc.list[fc.i];
 document.getElementById('fc-sub').textContent=`Карточка ${fc.i+1} из ${fc.list.length}`;
 document.getElementById('fc-body').innerHTML=`
   <div class="progress" style="margin-bottom:16px"><i style="width:${Math.round(fc.i/fc.list.length*100)}%"></i></div>
   <div class="fc" id="card">
     <div class="fc-inner">
       <div class="fc-face fc-front">
         <div class="fc-tag">Билет ${q.id} · ${esc(q.topic)}</div>
         <div class="q">${esc(q.text)}</div>
         <div class="fc-hint">Нажмите, чтобы увидеть ответ ⟳</div>
       </div>
       <div class="fc-face fc-back">
         <div class="fc-tag">Ответ · билет ${q.id}</div>
         <div class="a">${esc(q.flash)}</div>
       </div>
     </div>
   </div>
   <div class="grade" id="grade" style="visibility:hidden">
     <button class="g-no" onclick="gradeCard(false)">Повторить</button>
     <button class="g-yes" onclick="gradeCard(true)">Знал ✓</button>
   </div>`;
 const card=document.getElementById('card');
 card.onclick=()=>{ card.classList.toggle('flipped');
   document.getElementById('grade').style.visibility = card.classList.contains('flipped')?'visible':'hidden'; };
}
function gradeCard(known){
 const q=fc.list[fc.i]; progress.cards[q.id]=known; if(known) fc.known++;
 fc.i++; document.getElementById('fc-body').scrollTop=0; drawCard();
}
function showCardResult(){
 const total=fc.list.length, k=fc.known;
 document.getElementById('fc-body').innerHTML=`
   <div class="result">
     <div class="big">${k}/${total}</div>
     <div class="lbl">отмечено как «знал»</div>
     <div class="msg">${k===total?'Все карточки освоены!':'Повторите отмеченные карточки ещё раз.'}</div>
     <button class="btn btn-gold" onclick="startCards()">Ещё раз</button>
     <button class="btn btn-ghost" onclick="closeCards()">Готово</button>
   </div>`;
}
